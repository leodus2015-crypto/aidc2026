      <div class="ml-auto flex flex-wrap items-center gap-4">

            <a
              href="ai-dc-design.html"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"

          <li>

      <div class="w-full max-w-3xl xl:max-w-4xl">
        <h1 class="text-3xl font-bold tracking-tight text-slate-950 sm:text-5xl" data-i18n="page.h1"></h1>

        <p class="mt-4 text-base leading-7 text-slate-600 sm:text-lg" data-i18n="page.intro2"></p>

      <div class="min-w-0 w-full rounded-3xl border border-slate-200 bg-white p-5 shadow-xl shadow-slate-200/70 sm:p-6 lg:p-8">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div>
            <h2 class="text-lg font-semibold text-slate-900 sm:text-xl" data-i18n="edition.title"></h2>
            <p class="mt-2 text-sm leading-6 text-slate-600 sm:text-base" data-i18n="edition.desc"></p>
          </div>
          <div class="flex flex-wrap gap-2" id="whitepaper-actions">
            <a
              href="assets/aidc-whitepaper-2024-zh.pdf"
              target="_blank"
              rel="noopener noreferrer"
              data-whitepaper-action
              class="inline-flex items-center rounded-2xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-blue-600/25 transition hover:bg-blue-700"

            ></a>
            <a
              href="assets/aidc-whitepaper-2024-zh.pdf"
              download="AI DC白皮书_中文版.pdf"
              data-whitepaper-action
              data-i18n-download="edition.downloadName"
              class="inline-flex items-center rounded-2xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
              data-i18n="edition.download"
            ></a>
          </div>
        </div>

        <div
          id="whitepaper-missing"
          hidden
          class="aidc-inset-panel mt-6 rounded-2xl px-5 py-6 sm:px-6 sm:py-8"
          role="status"
        >
          <p id="whitepaper-missing-title" class="text-base font-semibold text-slate-900"></p>
          <p id="whitepaper-missing-desc" class="mt-2 text-sm leading-6 text-slate-600"></p>
          <p id="whitepaper-missing-deploy" class="mt-3 text-xs leading-5 text-slate-500"></p>
        </div>

        <div id="whitepaper-2024-viewer" hidden class="mt-6 overflow-hidden rounded-2xl border border-slate-200 bg-slate-100">
          <iframe
            src="assets/aidc-whitepaper-2024-zh.pdf"
            data-i18n-title="edition.iframeTitle"
            title="AI DC 白皮书 2024 中文版"
            class="h-[min(70vh,52rem)] w-full min-h-[20rem] bg-white"

        <p id="whitepaper-fallback-hint" class="mt-3 text-xs text-slate-500 sm:text-sm" data-i18n="edition.fallbackHint"></p>

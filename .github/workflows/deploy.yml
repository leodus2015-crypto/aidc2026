# push 到 main 后自动 rsync 到云服务器（需在 GitHub 仓库 Settings → Secrets 配置）
name: Deploy to aidc2026.cn

on:
  push:
    branches: [main]

concurrency:
  group: deploy-aidc2026
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Site static checks
        run: python3 scripts/check-site.py

      - name: API and formula tests
        run: |
          python3 -m pip install -q -r api/requirements.txt -r tests/requirements.txt
          python3 -m pytest tests -q

      - name: Setup SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'deploy.env' \
            --exclude '.DS_Store' \
            --exclude '.user.ini' \
            --exclude 'api/__pycache__/' \
            --exclude '**/__pycache__/' \
            --exclude '*.pyc' \
            --exclude 'data/analytics/geo-cache.json' \
            --exclude 'data/analytics/summary.json' \
            --exclude '.pytest_cache/' \
            --exclude '.venv/' \
            -e "ssh -p ${PORT} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Fix ownership
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_OWNER: ${{ secrets.DEPLOY_OWNER }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          OWNER="${DEPLOY_OWNER:-www:www}"
          ssh -p "${PORT}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chown ${OWNER} '${DEPLOY_PATH}' && find '${DEPLOY_PATH}' -mindepth 1 ! -name '.user.ini' -exec chown ${OWNER} {} +"

      - name: Verify lang-switch.js
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "${PORT}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -f '${DEPLOY_PATH}/js/lang-switch.js'"

      - name: Verify live HTTP 200
        run: |
          for path in /ai-dc-design.html /js/lang-switch.js /i18n/common.zh.json; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://www.aidc2026.cn${path}")"
            echo "${path} → HTTP ${code}"
            test "${code}" = "200"
          done

# 站点状态页（status.html：访问观测 + 后续运行状态）+ /api/analytics/
# 合并进 aidc2026.cn 的 server { }，放在静态 root 配置附近。
#
# 1) 生成口令文件（勿提交 git）：
#    htpasswd -c /www/server/pass/aidc_analytics.htpasswd analytics
#
# 2) 可选：仅允许办公室 IP
#    allow 1.2.3.4;
#    deny all;

location = /status.html {
    auth_basic "AIDC Status";
    auth_basic_user_file /www/server/pass/aidc_analytics.htpasswd;
}

location ^~ /data/analytics/ {
    auth_basic "AIDC Analytics";
    auth_basic_user_file /www/server/pass/aidc_analytics.htpasswd;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# 若 /api/ 已整体反代，可单独加强 analytics 路径（与 API Bearer 双保险）
location ^~ /api/analytics/ {
    auth_basic "AIDC Analytics";
    auth_basic_user_file /www/server/pass/aidc_analytics.htpasswd;
    proxy_pass http://127.0.0.1:8012/api/analytics/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}

# 可在 server {} 及任何包含 add_header 的 location {} 中重复 include。
# 原因：Nginx 的 add_header 不会从上级继承到已有 add_header 的 location。

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 当前页面仍依赖内联脚本/样式、Tailwind CDN 与 Chart.js CDN。
# 先使用 Report-Only 收集兼容性问题，完成静态化后再改为强制 CSP。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:8012 http://localhost:8012; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

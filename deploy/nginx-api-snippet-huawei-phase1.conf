# 华为云阶段 1：静态在本机，/api/ 反代到腾讯云 Config API（单库在腾讯，避免双写）
# 将 TENCENT_API_ORIGIN 换成腾讯 ECS 公网 IP 或 https://www.aidc2026.cn
# 合并进华为站点 Nginx server（与静态 root 同 server）
#
# 注意：腾讯 API 需允许华为 ECS 出口 IP；生产更推荐 VPN/专线 + 内网地址。

location /api/ {
    proxy_pass https://www.aidc2026.cn/api/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host www.aidc2026.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 静态站 cache-bust 策略（合并进 aidc2026.cn 的 server { }，位于 PHP/静态 root 配置附近）
#
# 前提：HTML 中本地 js/css 已带 ?v=N（由 scripts/bump-asset-version.py 维护）。
# 部署后若仍见旧页：硬刷新，或检查 CDN 是否需 purge。

# HTTP 全站跳 HTTPS。本文件同时被 80/443 引用时生效；仅 HTTPS server 引入则不影响。
# 部署后需 reload nginx。
if ($scheme != "https") {
    return 301 https://$host$request_uri;
}

# 站点根入口明确指向 AI DC 规划；/index.html 保留为 Agentic 推理页面。
location = / {
    return 301 https://$host/ai-dc-design.html;
}

# 已删除的旧 HTML 入口改由服务端重定向，避免保留无功能兼容壳。
location = /capacity.html {
    return 301 "/index.html#capacity";
}

location = /docs.html {
    return 301 "/index.html#docs";
}

location = /inference/ {
    return 301 "/index.html?tab=principles#inference";
}

location = /inference/index.html {
    return 301 "/index.html?tab=principles#inference";
}

location = /aidc-investment-roi.en.html {
    return 301 /aidc-investment-roi.html?lang=en;
}

location = /ai-dc-layout.html {
    return 301 /aidc-layout-Card2Power.html$is_args$args;
}

location = /ai-dc-layout_37.html {
    return 301 /aidc-layout-Card2Power.html$is_args$args;
}

location = /white-paper.html {
    return 301 /topic.html$is_args$args;
}

location = /topic-agent-reshape.html {
    return 301 /topic-sovereign-ai.html$is_args$args;
}

location = /topic/sovereign-ai-zh.html {
    return 301 /topic/sovereign-ai/sovereign-ai-zh.html$is_args$args;
}

location = /topic/sovereign-ai.html {
    return 301 /topic/sovereign-ai/sovereign-ai.html$is_args$args;
}

# server 级安全响应头；下方已有 add_header 的 location 需再次 include。
include /www/wwwroot/aidc2026.cn/deploy/nginx-security-headers.conf;

# HTML：每次访问至少协商，避免壳页面长期 stale
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    include /www/wwwroot/aidc2026.cn/deploy/nginx-security-headers.conf;
}

# 版本清单：供排查，不缓存
location = /data/asset-version.json {
    add_header Cache-Control "no-cache, must-revalidate" always;
    include /www/wwwroot/aidc2026.cn/deploy/nginx-security-headers.conf;
}

# 带 ?v= 的 JS/CSS：URL 变即新资源，可长期缓存
map $args $aidc_js_css_cache {
    ~*v=    "public, max-age=31536000, immutable";
    default "public, max-age=300, must-revalidate";
}

location ~* \.(js|css)$ {
    add_header Cache-Control $aidc_js_css_cache always;
    include /www/wwwroot/aidc2026.cn/deploy/nginx-security-headers.conf;
}

# i18n JSON（fetch 已带 ?v=，与 js 同理）
location ^~ /i18n/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /www/wwwroot/aidc2026.cn/deploy/nginx-security-headers.conf;
}

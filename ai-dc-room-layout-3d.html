<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="可交互的 AI 数据中心 3D 机房布局：园区、四层建筑与单层详细机房。" />
  <meta name="theme-color" content="#07111f" />
  <link rel="canonical" href="https://www.aidc2026.cn/ai-dc-room-layout-3d.html" />
  <title>机房布局 3D · AI Data Center</title>
  <script src="js/aidc-theme.js?v=87"></script>
  <script src="js/embed-mode.js?v=87"></script>
  <script src="js/theme-switch.js?v=87"></script>
  <script src="js/aidc-asset-version.js?v=87"></script>
  <script src="js/aidc-locale-bridge.js?v=87"></script>
  <link rel="stylesheet" href="css/theme.css?v=87" />
  <link rel="stylesheet" href="css/embed.css?v=87" />
  <link rel="stylesheet" href="css/ai-dc-room-layout-3d.css?v=87" />
</head>
<body data-i18n-page="ai-dc-room-layout-3d">
  <header class="aidc-chrome site-header">
    <a href="ai-dc-design.html" class="brand" aria-label="AIDC 2026 · 首页">
      <img src="aidc2026-logo.svg" alt="AIDC 2026" width="593" height="118" />
    </a>
    <strong data-i18n="meta.shortTitle">机房布局 3D</strong>
    <div id="theme-switch-root"></div>
    <div id="lang-switch-root"></div>
  </header>

  <main id="three-app" class="three-app" aria-label="3D 数据中心布局浏览器" data-i18n-aria-label="app.aria">
    <div id="scene-host" class="scene-host" aria-hidden="true"></div>

    <div id="scene-panel" class="top-hud glass-panel hud-collapsible is-collapsed">
      <button type="button" class="overlay-toggle" aria-expanded="false" aria-controls="scene-panel-content" aria-label="场景信息" data-i18n-aria-label="overlays.scene">
        <span aria-hidden="true">▣</span>
        <em data-i18n="overlays.scene">场景信息</em>
      </button>
      <div id="scene-panel-content" class="overlay-panel-content">
        <div class="eyebrow" data-i18n="app.eyebrow">AIDC DIGITAL TWIN</div>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="当前位置" data-i18n-aria-label="breadcrumb.aria">
          <button type="button" data-view="campus" aria-current="page" data-i18n="breadcrumb.campus">园区总览</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-view="building" disabled data-i18n="breadcrumb.building">A02 数据中心楼</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-view="floor" disabled id="floor-crumb">1F 单层机房</button>
        </nav>
        <h1 id="view-title" data-i18n="campus.title">AIDC 园区整体布局</h1>
        <p id="view-description" data-i18n="campus.description">拖动旋转园区，点击高亮的 A02 数据中心楼进入建筑。</p>
      </div>
    </div>

    <aside id="model-panel" class="info-panel glass-panel hud-collapsible is-collapsed" aria-live="polite">
      <button type="button" class="overlay-toggle" aria-expanded="false" aria-controls="model-panel-content" aria-label="模型信息" data-i18n-aria-label="overlays.model">
        <span aria-hidden="true">ⓘ</span>
        <em data-i18n="overlays.model">模型信息</em>
      </button>
      <div id="model-panel-content" class="overlay-panel-content">
        <div class="info-head">
          <span class="live-dot" aria-hidden="true"></span>
          <span data-i18n="info.live">模型信息</span>
        </div>
        <strong id="info-title">A02 数据中心楼</strong>
        <p id="info-body" data-i18n="campus.info">园区核心算力建筑，共三层数据机房及一层屋面设备层。</p>
        <div id="info-stats" class="info-stats">
          <span><b>3</b><small data-i18n="stats.dataFloors">数据层</small></span>
          <span><b>12</b><small data-i18n="stats.pods">POD</small></span>
          <span><b>3,840</b><small data-i18n="stats.racks">机柜</small></span>
        </div>
        <img class="reference-image" alt="AIDC 园区布局参考图" data-i18n-alt="campus.referenceAlt" hidden />
      </div>
    </aside>

    <div id="scene-actions" class="scene-actions glass-panel" aria-label="当前场景可选对象" data-i18n-aria-label="actions.aria"></div>

    <div class="controls-hud glass-panel">
      <div class="control-help">
        <span><i class="mouse-icon drag-icon" aria-hidden="true"></i><em data-i18n="controls.rotate">左键拖动 · 旋转</em></span>
        <span><i class="mouse-icon zoom-icon" aria-hidden="true"></i><em data-i18n="controls.zoom">滚轮 · 缩放</em></span>
        <span><i class="mouse-icon pan-icon" aria-hidden="true"></i><em data-i18n="controls.pan">右键拖动 · 平移</em></span>
      </div>
      <div class="control-buttons">
        <button type="button" id="back-button" class="hud-button" hidden data-i18n="controls.back">返回上一级</button>
        <button type="button" id="reset-button" class="hud-button primary" data-i18n="controls.reset">重置视角</button>
      </div>
    </div>

    <div id="tooltip" class="scene-tooltip" role="status" hidden></div>
    <div id="loading" class="loading-state">
      <span class="loader" aria-hidden="true"></span>
      <span data-i18n="app.loading">正在加载 3D 场景…</span>
    </div>
    <div id="webgl-fallback" class="webgl-fallback" hidden>
      <strong data-i18n="fallback.title">当前浏览器无法显示 3D 场景</strong>
      <p data-i18n="fallback.body">请启用浏览器硬件加速，或使用最新版 Chrome、Edge、Safari 浏览器。</p>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script src="js/i18n.js?v=87"></script>
  <script src="js/lang-switch.js?v=87"></script>
  <script src="js/i18n-bootstrap.js?v=87"></script>
  <script type="module" src="js/ai-dc-room-layout-3d.js?v=87"></script>
</body>
</html>

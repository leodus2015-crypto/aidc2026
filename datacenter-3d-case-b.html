<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DataCenter 3D 设计器 · 案例A（风冷超节点）</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --dc-page: #f8fafc;
    --dc-bg: #f4f3ef;
    --dc-surface: #ffffff;
    --dc-surface-muted: #fafaf9;
    --dc-surface-inset: #f5f5f4;
    --dc-border: #e7e5e4;
    --dc-border-strong: #d6d3d1;
    --dc-text: #1c1917;
    --dc-text-secondary: #57534e;
    --dc-text-muted: #78716c;
    --dc-text-faint: #a8a29e;
    --dc-accent: #2563eb;
    --dc-accent-soft: #dbeafe;
    --dc-shadow: rgba(28, 25, 23, 0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--dc-bg); color: var(--dc-text);
    overflow: hidden; height: 100dvh; width: 100vw;
    overscroll-behavior: none;
  }
  button { cursor: pointer; font-family: inherit; }
  input, select { font-family: inherit; outline: none; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  /* ===== Top Bar ===== */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 48px; background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--dc-border);
    box-shadow: 0 1px 0 var(--dc-shadow);
    display: flex; align-items: center; padding: 0 10px; gap: 6px;
  }
  #topbar .logo { font-size: 14px; font-weight: 700; color: var(--dc-text); white-space: nowrap; }
  #topbar .logo small { font-size: 9px; color: var(--dc-text-muted); margin-left: 3px; font-weight: 500; display: none; }
  @media (min-width: 600px) { #topbar .logo small { display: inline; } }

  .tb-group { display: flex; gap: 2px; background: #f1f5f9; border-radius: 7px; padding: 3px; border: 1px solid var(--dc-border); }
  .tb-btn {
    padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: 600;
    background: transparent; color: var(--dc-text-muted); border: none; transition: all .2s; white-space: nowrap;
  }
  .tb-btn:hover { color: var(--dc-text); background: rgba(255,255,255,0.7); }
  .tb-btn.active { background: #ffffff; color: #1d4ed8; box-shadow: 0 1px 2px var(--dc-shadow); }
  @media (min-width: 600px) { .tb-btn { padding: 4px 12px; font-size: 11px; } }

  .color-group { display: flex; gap: 2px; background: #f1f5f9; border-radius: 7px; padding: 3px; border: 1px solid var(--dc-border); }
  .color-btn {
    padding: 3px 6px; border-radius: 5px; font-size: 9px; font-weight: 600;
    background: transparent; color: var(--dc-text-muted); border: none; transition: all .2s;
  }
  .color-btn:hover { color: var(--dc-text); background: rgba(255,255,255,0.7); }
  .color-btn.active { background: #ffffff; color: #1d4ed8; box-shadow: 0 1px 2px var(--dc-shadow); }
  @media (min-width: 600px) { .color-btn { padding: 4px 10px; font-size: 11px; } }

  #sidebar-toggle {
    margin-left: auto; padding: 4px 10px; border-radius: 6px; font-size: 11px;
    background: var(--dc-surface); color: var(--dc-text-secondary); border: 1px solid var(--dc-border); transition: all .2s;
  }
  #sidebar-toggle:hover { background: var(--dc-surface-inset); color: var(--dc-text); }

  /* ===== Sidebar ===== */
  #sidebar {
    position: fixed; top: 48px; left: 0; bottom: 0; z-index: 90;
    width: 310px; background: var(--dc-surface); border-right: 1px solid var(--dc-border);
    box-shadow: 4px 0 24px var(--dc-shadow);
    transform: translateX(0); transition: transform .3s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar.closed { transform: translateX(-100%); }

  .sb-tabs { display: flex; border-bottom: 1px solid var(--dc-border); flex-shrink: 0; background: var(--dc-surface-muted); }
  .sb-tab {
    flex: 1; padding: 10px 4px; text-align: center; font-size: 11px; font-weight: 600;
    color: var(--dc-text-muted); background: transparent; border: none;
    border-bottom: 2px solid transparent; transition: all .2s;
  }
  .sb-tab:hover { color: var(--dc-text-secondary); }
  .sb-tab.active { color: #1d4ed8; border-bottom-color: #2563eb; background: var(--dc-surface); }
  .sb-content { flex: 1; overflow-y: auto; padding: 14px; background: var(--dc-bg); }
  .config-source-badge {
    margin: 0;
    padding: 8px 14px;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.45;
    border-bottom: 1px solid var(--dc-border);
    background: var(--dc-surface-muted);
    color: var(--dc-text-muted);
  }
  .config-source-badge.database {
    background: #ecfdf5;
    color: #065f46;
    border-bottom-color: #6ee7b7;
  }
  .config-source-badge.cache {
    background: #fffbeb;
    color: #92400e;
    border-bottom-color: #fcd34d;
  }
  .config-source-badge.local {
    background: var(--dc-surface-muted);
    color: var(--dc-text-muted);
  }
  .sb-panel { display: none; }
  .sb-panel.active { display: block; }

  .sbf-group { margin-bottom: 14px; }
  .sbf-label { display: block; font-size: 10px; color: var(--dc-text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; font-weight: 600; }
  .sbf-row { display: grid; gap: 8px; }
  .sbf-row.c4 { grid-template-columns: repeat(4, 1fr); }
  .sbf-row.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .sbf-row.c2 { grid-template-columns: 1fr 1fr; }
  .sbf-input {
    width: 100%; padding: 6px 8px; border-radius: 5px; border: 1px solid var(--dc-border);
    background: var(--dc-surface); color: var(--dc-text); font-size: 12px; transition: border-color .2s, box-shadow .2s;
  }
  .sbf-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
  .sbf-input:disabled { background: #f3f4f6; color: #6b7280; cursor: not-allowed; opacity: 1; }
  select.sbf-input { appearance: auto; }
  .sbf-hint { font-size: 9px; color: var(--dc-text-faint); margin-top: 2px; line-height: 1.3; }

  .layout-actions { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 8px; }
  .layout-actions button { padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .rule-actions { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 8px; margin-top: 8px; }
  .rule-actions button { padding: 7px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .btn-primary {
    padding: 7px 16px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none;
    transition: filter .2s; width: 100%;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-sm { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; border: none; transition: all .2s; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn-outline { background: var(--dc-surface); border: 1px solid var(--dc-border); color: var(--dc-text-secondary); }
  .btn-outline:hover { border-color: #2563eb; color: #2563eb; background: var(--dc-accent-soft); }
  .btn-success { background: #10b981; color: #fff; }
  .btn-success:hover { filter: brightness(1.08); }

  .rule-list { display: flex; flex-direction: column; gap: 6px; }
  .rule-item {
    background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: 6px;
    padding: 8px 10px; font-size: 12px;
    display: flex; align-items: center; gap: 8px;
    transition: border-color .2s, box-shadow .2s;
  }
  .rule-item:hover { border-color: var(--dc-border-strong); box-shadow: 0 1px 3px var(--dc-shadow); }
  .rule-item.disabled { opacity: 0.55; }
  .rule-item .r-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .rule-item .r-info { flex: 1; line-height: 1.4; }
  .rule-item .r-title { font-weight: 600; font-size: 12px; color: var(--dc-text); }
  .rule-item .r-desc { font-size: 10px; color: var(--dc-text-muted); }
  .rule-item .r-actions { display: flex; gap: 3px; flex-shrink: 0; }

  .rule-form {
    background: var(--dc-surface-muted); border: 1px solid var(--dc-border); border-radius: 6px; padding: 12px;
    margin-top: 8px; display: none;
  }
  .rule-form.open { display: block; }

  .view-list { display: flex; flex-direction: column; gap: 4px; }
  .view-item {
    background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: 5px;
    padding: 7px 10px; font-size: 12px; display: flex; align-items: center; gap: 8px;
    transition: border-color .2s;
  }
  .view-item:hover { border-color: #2563eb; }
  .view-item .v-name { flex: 1; display: flex; align-items: center; gap: 6px; color: var(--dc-text); }
  .view-item .v-actions { display: flex; gap: 3px; }
  .save-view-form { display: flex; gap: 6px; margin-top: 8px; }
  .save-view-form input { flex: 1; }
  .row-filter { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--dc-border); }

  #container3d {
    position: fixed; top: 48px; left: 310px; right: 0; bottom: 0;
    transition: left .3s cubic-bezier(.4,0,.2,1);
    background: var(--dc-bg);
  }
  #container3d.expanded { left: 0; }

  #tooltip {
    position: fixed; z-index: 80; pointer-events: none;
    background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
    border: 1px solid var(--dc-border); border-radius: 8px;
    padding: 8px 12px; font-size: 12px; line-height: 1.4;
    opacity: 0; transition: opacity .15s; min-width: 140px;
    max-width: min(260px, calc(100vw - 20px));
    box-shadow: 0 8px 24px var(--dc-shadow);
  }
  #tooltip.show { opacity: 1; }
  #tooltip .tt-name { color: var(--dc-text); font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #tooltip .tt-pos { color: var(--dc-text-muted); font-size: 10px; }
  #tooltip .tt-tag { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 9px; font-weight: 600; line-height: 1.35; }
  #tooltip .tt-pwr { font-size: 10px; color: var(--dc-text-muted); margin-top: 1px; }
  #tooltip .tt-sections { margin-top: 6px; }
  #tooltip .tt-section + .tt-section { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--dc-border); }
  #tooltip .tt-section-head { display: flex; align-items: center; gap: 6px; }
  #tooltip .tt-section-body { margin-top: 3px; font-size: 10px; line-height: 1.45; color: var(--dc-text-secondary); }
  #tooltip .tt-shared { margin-top: 6px; font-size: 9px; color: var(--dc-text-faint); }

  #toast-container {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 300;
    display: flex; flex-direction: column; gap: 6px; align-items: center;
    pointer-events: none; width: 90%; max-width: 400px;
  }
  .toast {
    padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 500;
    background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(8px);
    border: 1px solid var(--dc-border); color: var(--dc-text);
    animation: toastIn .25s ease-out;
    text-align: center; pointer-events: auto;
    width: 100%; box-shadow: 0 8px 24px var(--dc-shadow);
  }
  .toast.leaving { animation: toastOut .25s ease-in forwards; }
  .toast.success { border-color: #10b981; background: #ecfdf5; color: #065f46; }
  .toast.warn { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-12px) scale(.95); } }

  #stats {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 10px; font-size: 10px; color: var(--dc-text-muted);
    background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px);
    padding: 4px 12px; border-radius: 99px; border: 1px solid var(--dc-border);
    box-shadow: 0 4px 16px var(--dc-shadow);
    pointer-events: none; white-space: nowrap;
  }
  #stats span { color: var(--dc-text-secondary); }
  @media (max-width: 480px) {
    #stats { font-size: 9px; gap: 6px; padding: 3px 10px; bottom: 4px; }
  }
  #stats .stat-divider { color: var(--dc-border-strong); }

  #confirm-overlay {
    position: fixed; inset: 0; z-index: 250;
    background: rgba(28, 25, 23, 0.28); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #confirm-overlay.open { display: flex; }
  #confirm-box {
    background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: 12px;
    padding: 20px; max-width: 360px; width: 100%;
    box-shadow: 0 20px 60px rgba(28, 25, 23, 0.12);
  }
  #confirm-box h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--dc-text); }
  #confirm-box p { font-size: 12px; color: var(--dc-text-secondary); margin-bottom: 16px; line-height: 1.4; }
  #confirm-box .cf-actions { display: flex; gap: 8px; justify-content: flex-end; }

  #pwd-overlay {
    position: fixed; inset: 0; z-index: 260;
    background: rgba(28, 25, 23, 0.28); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #pwd-overlay.open { display: flex; }
  #pwd-box {
    background: var(--dc-surface); border: 1px solid var(--dc-border); border-radius: 12px;
    padding: 20px; max-width: 360px; width: 100%;
    box-shadow: 0 20px 60px rgba(28, 25, 23, 0.12);
  }
  #pwd-box h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--dc-text); }
  #pwd-box p { font-size: 12px; color: var(--dc-text-secondary); margin-bottom: 12px; line-height: 1.4; }
  #pwd-box .pwd-error { font-size: 11px; color: #dc2626; margin-top: 6px; display: none; }
  #pwd-box .cf-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  #sidebar ::-webkit-scrollbar { width: 3px; }
  #sidebar ::-webkit-scrollbar-track { background: transparent; }
  #sidebar ::-webkit-scrollbar-thumb { background: var(--dc-border-strong); border-radius: 99px; }

  @media (max-width: 860px) {
    #sidebar { width: 280px; }
    #container3d { left: 280px; }
  }

  @media (max-width: 640px) {
    #sidebar {
      width: 100%; border-right: none; transform: translateX(-100%);
      background: var(--dc-surface);
    }
    #sidebar.closed { transform: translateX(-100%); }
    #container3d { left: 0 !important; }
    #stats { font-size: 9px; gap: 6px; padding: 3px 10px; }
    .color-group .color-btn-label { display: none; }
  }

  @media (max-width: 400px) {
    #topbar .logo { font-size: 12px; }
    .tb-btn { padding: 3px 6px; font-size: 9px; }
    #sidebar-toggle { padding: 3px 8px; font-size: 10px; }
    #stats { font-size: 8px; gap: 4px; padding: 2px 8px; }
    #stats .stat-item { display: none; }
    #stats .stat-item.mobile-show { display: inline; }
  }
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div id="topbar">
  <div class="logo">⚡ DC Designer <small>案例A（风冷超节点） · 数据中心 3D 设计器</small></div>
  <div class="tb-group">
    <button class="tb-btn active" data-view="top">俯视</button>
    <button class="tb-btn" data-view="horiz">水平</button>
    <button class="tb-btn" data-view="angle">透视</button>
    <button class="tb-btn" data-view="cooling">Cooling</button>
  </div>
  <div class="color-group">
    <button class="color-btn active" data-mode="type">类型</button>
    <button class="color-btn" data-mode="power">功率</button>
  </div>
  <button id="sidebar-toggle">☰</button>
</div>

<!-- ===== Sidebar ===== -->
<div id="sidebar">
  <div class="sb-tabs">
    <button class="sb-tab active" data-tab="layout">📐 布局</button>
    <button class="sb-tab" data-tab="rules">📋 规则</button>
    <button class="sb-tab" data-tab="views">👁 视图</button>
  </div>
  <p id="configSourceBadge" class="config-source-badge local" aria-live="polite">配置来源：加载中…</p>
  <div class="sb-content">

    <!-- LAYOUT -->
    <div class="sb-panel active" id="panel-layout">
      <div class="sbf-group">
        <div class="sbf-label">机房结构</div>
        <div class="sbf-row c2" style="margin-bottom:6px">
          <div><label class="sbf-label" style="font-size:9px;">排数</label><input class="sbf-input" id="cfg-rows" type="number" value="8" min="1"></div>
          <div><label class="sbf-label" style="font-size:9px;">每排机柜数</label><input class="sbf-input" id="cfg-cols" type="number" value="13" min="1"></div>
        </div>
        <div class="sbf-row c2" style="margin-bottom:6px">
          <div><label class="sbf-label" style="font-size:9px;">冷通道 (m)</label><input class="sbf-input" id="cfg-cold-aisle" type="number" value="1.6" min="0.1" step="0.1"></div>
          <div><label class="sbf-label" style="font-size:9px;">热通道 (m)</label><input class="sbf-input" id="cfg-hot-aisle" type="number" value="1.2" min="0.1" step="0.1"></div>
        </div>
        <div class="sbf-row c2">
          <div><label class="sbf-label" style="font-size:9px;">机柜深度 (m)</label><input class="sbf-input" id="cfg-depth" type="number" value="1.0" min="0.1" step="0.1"></div>
          <div><label class="sbf-label" style="font-size:9px;">机柜高度 (U)</label><input class="sbf-input" id="cfg-u" type="number" value="42" min="1"></div>
        </div>
      </div>
      <div class="sbf-group">
        <div class="sbf-label">机柜尺寸</div>
        <div class="sbf-row c3">
          <div><label class="sbf-label" style="font-size:9px;">宽度 (m)</label><input class="sbf-input" id="cfg-width" type="number" value="0.6" min="0.1" step="0.05"></div>
          <div><label class="sbf-label" style="font-size:9px;">深度 (m)</label><input class="sbf-input" id="cfg-depth2" type="number" value="1.0" min="0.1" step="0.1"></div>
          <div><label class="sbf-label" style="font-size:9px;">1U 高 (mm)</label><input class="sbf-input" id="cfg-umm" type="number" value="44.45" min="1" step="0.1"></div>
        </div>
      </div>
      <div class="sbf-group">
        <div class="sbf-label">机柜功耗</div>
        <div class="sbf-row c4">
          <div><label class="sbf-label" style="font-size:9px;">AI (W)</label><input class="sbf-input" id="cfg-w-ai" type="number" value="15000" step="100"></div>
          <div><label class="sbf-label" style="font-size:9px;">总线 (W)</label><input class="sbf-input" id="cfg-w-bus" type="number" value="7000" step="50"></div>
          <div><label class="sbf-label" style="font-size:9px;">Leaf (W)</label><input class="sbf-input" id="cfg-w-norm" type="number" value="300" step="50"></div>
          <div><label class="sbf-label" style="font-size:9px;">空机柜 (W)</label><input class="sbf-input" id="cfg-w-empty" type="number" value="0" step="50"></div>
        </div>
      </div>
      <div class="layout-actions">
        <button class="btn-outline" id="btn-unlock-layout">解锁</button>
        <button class="btn-primary" id="btn-apply-layout">✓ 更新布局</button>
      </div>
    </div>

    <!-- RULES -->
    <div class="sb-panel" id="panel-rules">
      <div style="font-size:12px;font-weight:600;margin-bottom:4px;">机柜类型分配规则</div>
      <div style="font-size:10px;color:#64748b;margin-bottom:10px;line-height:1.4;">
        规则按顺序执行（从上到下），后执行的覆盖前面的冲突。<br>
        规则中的行列号从 <strong>1</strong> 开始计数。
      </div>
      <div class="rule-list" id="rule-list"></div>
      <div class="rule-form" id="rule-form">
        <div class="sbf-row c2" style="margin-bottom:6px">
          <div>
            <label class="sbf-label" style="font-size:9px;">行号范围</label>
            <input class="sbf-input" id="rule-rows" placeholder='例: "3-6" 或 "1-7:2" 或 "1,3,5,7"'>
            <div class="sbf-hint">行号从 1 开始，如 "3-6" 表示第 3~6 排</div>
          </div>
          <div>
            <label class="sbf-label" style="font-size:9px;">列号范围</label>
            <input class="sbf-input" id="rule-cols" placeholder='例: "1" 或 "4,7,10"'>
            <div class="sbf-hint">列号从 1 开始，如 "1" 表示第 1 柜</div>
          </div>
        </div>
        <div class="sbf-row c3" style="margin-bottom:8px">
          <div>
            <label class="sbf-label" style="font-size:9px;">类型</label>
            <select class="sbf-input" id="rule-type">
              <option value="ai">AI 设备柜</option>

// ======================================================================
// Rack type computation — NOW 1-INDEXED
// ======================================================================
function parseRange(str) {
  if (!str || !str.trim()) return [];
  const s = str.trim();
  if (s.includes(',')) return s.split(',').map(v => parseInt(v)).filter(v => !isNaN(v));
  const m = s.match(/^(\d+)-(\d+)(?::(\d+))?$/);
  if (m) {
    const start = parseInt(m[1]), end = parseInt(m[2]), step = m[3] ? parseInt(m[3]) : 1;
    const res = [];
    for (let i = start; i <= end; i += step) res.push(i);
    return res;
  }
  const v = parseInt(s);
  return isNaN(v) ? [] : [v];
}

function computeMatchingRuleTypes(row0, col0, rules) {
  const row = row0 + 1;
  const col = col0 + 1;
  const priority = { ai: 3, bus: 2, normal: 1 };
  const matched = new Set();
  for (const rule of rules) {
    if (!rule.enabled) continue;
    const rows = parseRange(rule.rows);
    const cols = parseRange(rule.cols);
    if (rows.includes(row) && cols.includes(col)) matched.add(rule.type);
  }
  return Array.from(matched).sort((a, b) => (priority[b] || 0) - (priority[a] || 0));
}

function getTooltipTypeLabel(type, shared) {
  if (shared && type === 'ai') return 'AI 机柜';
  if (shared && type === 'normal') return 'Leaf交换机';
  const labels = { ai: 'AI 设备柜', bus: '总线交换机柜', normal: 'Leaf交换机', empty: '空机柜' };
  return labels[type] || 'Leaf交换机';
}

function getTooltipDevices(type, shared) {
  const devices = getDefaultDevices(type).map(device => ({ ...device }));
  if (shared && type === 'normal') {
    devices.forEach(device => { device.name = 'Leaf交换机'; });
  }
  return devices;
}

function computeRackType(row0, col0, rules) {
  const types = computeMatchingRuleTypes(row0, col0, rules);
  return types[0] || 'normal';
}

function getRackDevices(row, col) {
  const types = computeMatchingRuleTypes(row, col, store.rules);
  if (types.length === 0) return getDefaultDevices('empty');
  const devices = [];
  for (const type of types) devices.push(...getDefaultDevices(type));
  return devices;
}

function getDefaultDevices(type) {
  switch (type) {
    case 'ai': return [{ name: 'AI 机柜', u: C.rackU, qty: 1, power: C.defaultPower.ai }];
    case 'bus': return [{ name: '总线机柜', u: C.rackU, qty: 1, power: C.defaultPower.bus }];
    case 'normal': return [{ name: 'Leaf交换机', u: C.rackU, qty: 1, power: C.defaultPower.normal }];
    case 'empty': return C.defaultPower.empty > 0 ? [{ name: '空机柜', u: 0, qty: 1, power: C.defaultPower.empty }] : [];
    default: return [];
  }
}

function calcRackPower(devices) {
  return devices.reduce((a, d) => a + (d.power || 0) * (d.qty || 0), 0);
}

function calcRackUsedU(devices) {
  return devices.reduce((a, d) => a + d.u * d.qty, 0);
}

// ======================================================================
// 3D Rack
// ======================================================================
const RACK_COLORS = { ai: 0x3b82f6, bus: 0x10b981, normal: 0xf59e0b, empty: 0x6b7280 };
const PWR_COLORS = [0x10b981, 0x84cc16, 0xf59e0b, 0xef4444];
const ZERO_POWER_COLOR = new THREE.Color(0xd6d3d1);

function isAiLeafSplitRack(matchedTypes) {
  return matchedTypes && matchedTypes.includes('ai') && matchedTypes.includes('normal');
}

function makeRackBodyMaterial(color, emissiveIntensity = 0.02) {
  const c = color instanceof THREE.Color ? color : new THREE.Color(color);
  return new THREE.MeshStandardMaterial({
    color: c, roughness: 0.4, metalness: 0.15,
    emissive: c.clone(), emissiveIntensity,
  });
}

function getRackTypeColor(row, col, matchedTypes, type) {
  if (isEmptyNormalRack(row, col, type)) return new THREE.Color(RACK_COLORS.empty);
  return new THREE.Color(RACK_COLORS[type] || RACK_COLORS.normal);
}

function getRackAccentColor(row, col, matchedTypes, type, ySign) {
  if (isEmptyNormalRack(row, col, type)) {
    return new THREE.Color(RACK_COLORS.empty).multiplyScalar(0.65);
  }
  if (isAiLeafSplitRack(matchedTypes)) {
    return new THREE.Color(ySign > 0 ? RACK_COLORS.normal : RACK_COLORS.ai).multiplyScalar(0.65);
  }
  return getRackTypeColor(row, col, matchedTypes, type).clone().multiplyScalar(0.65);
}

function addRackBodyMeshes(group, row, col, matchedTypes, type, rw, rh, rd) {
  const bodyW = rw * 0.96, bodyH = rh * 0.96, bodyD = rd * 0.96;
  let edgeColor;
  if (isEmptyNormalRack(row, col, type)) {
    const baseColor = new THREE.Color(RACK_COLORS.empty);
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(bodyW, bodyH, bodyD),
      makeRackBodyMaterial(baseColor, 0.02)
    );
    body.userData.rackColorPart = 'single';
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);
    edgeColor = baseColor;
  } else if (isAiLeafSplitRack(matchedTypes)) {
    const halfH = bodyH / 2;
    const bottomColor = new THREE.Color(RACK_COLORS.ai);
    const topColor = new THREE.Color(RACK_COLORS.normal);
    const bottom = new THREE.Mesh(
      new THREE.BoxGeometry(bodyW, halfH, bodyD),
      makeRackBodyMaterial(bottomColor, 0.06)
    );
    bottom.userData.rackColorPart = 'bottom';
    bottom.position.y = -halfH / 2;
    bottom.castShadow = true;
    bottom.receiveShadow = true;
    group.add(bottom);
    const top = new THREE.Mesh(
      new THREE.BoxGeometry(bodyW, halfH, bodyD),
      makeRackBodyMaterial(topColor, 0.03)
    );
    top.userData.rackColorPart = 'top';
    top.position.y = halfH / 2;
    top.castShadow = true;
    top.receiveShadow = true;
    group.add(top);
    edgeColor = bottomColor.clone().lerp(topColor, 0.5);
  } else {
    const baseColor = getRackTypeColor(row, col, matchedTypes, type);
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(bodyW, bodyH, bodyD),
      makeRackBodyMaterial(baseColor, type === 'ai' ? 0.06 : 0.02)
    );
    body.userData.rackColorPart = 'single';
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);
    edgeColor = baseColor;
  }
  const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(bodyW, bodyH, bodyD));
  const edgeMat = new THREE.LineBasicMaterial({
    color: edgeColor.clone().multiplyScalar(1.4), transparent: true, opacity: 0.2,
  });
  const edges = new THREE.LineSegments(edgeGeo, edgeMat);
  edges.userData.rackColorPart = 'edge';
  group.add(edges);
  return edgeColor;
}

function applyRackTypeColor(group, ud, powerColor) {
  const matchedTypes = ud.matchedTypes;
  const split = isAiLeafSplitRack(matchedTypes);
  const type = ud.type;
  const p = ud.power || 0;
  const isZeroPower = C.colorMode === 'power' && p <= 0;
  const isEmpty = isEmptyNormalRack(ud.row, ud.col, type);
  const bottomColor = new THREE.Color(RACK_COLORS.ai);
  const topColor = new THREE.Color(RACK_COLORS.normal);
  const singleColor = powerColor || (isEmpty
    ? new THREE.Color(RACK_COLORS.empty)
    : new THREE.Color(RACK_COLORS[type] || RACK_COLORS.normal));

  group.traverse(child => {
    if (!child.isMesh || !child.material) return;
    const part = child.userData.rackColorPart;
    if (part === 'accent') {
      if (C.colorMode === 'power') {
        child.material.color.copy(singleColor);
      } else {
        child.material.color.copy(getRackAccentColor(ud.row, ud.col, matchedTypes, type, child.userData.ySign || 1));
      }
      child.material.needsUpdate = true;
      return;
    }
    if (part === 'bottom') {
      child.material.color.copy(C.colorMode === 'power' ? singleColor : bottomColor);
      child.material.emissive.copy(child.material.color);
      child.material.emissiveIntensity = isZeroPower ? 0 : 0.06;
    } else if (part === 'top') {
      child.material.color.copy(C.colorMode === 'power' ? singleColor : topColor);
      child.material.emissive.copy(child.material.color);
      child.material.emissiveIntensity = isZeroPower ? 0 : 0.03;
    } else if (part === 'single') {
      child.material.color.copy(singleColor);
      child.material.emissive.copy(singleColor);
      child.material.emissiveIntensity = isZeroPower ? 0 : (isEmpty ? 0.02 : (type === 'ai' ? 0.06 : 0.02));
    }
    if (part === 'bottom' || part === 'top' || part === 'single') {
      child.material.transparent = isZeroPower;
      child.material.opacity = isZeroPower ? 0.34 : 1;
      child.material.needsUpdate = true;
    }
  });
  group.children.forEach(child => {
    if (child.isLineSegments && child.userData.rackColorPart === 'edge') {
      const edgeColor = C.colorMode === 'power'
        ? singleColor
        : (isEmpty
          ? new THREE.Color(RACK_COLORS.empty)
          : (split ? bottomColor.clone().lerp(topColor, 0.5) : singleColor));
      child.material.color.copy(edgeColor).multiplyScalar(1.4);
      child.material.opacity = isZeroPower ? 0.12 : 0.2;
      child.material.needsUpdate = true;
    }
  });
}

function interpolateColor(colors, t) {
  t = Math.max(0, Math.min(1, t));
  const idx = t * (colors.length - 1);
  const i = Math.floor(idx);
  const f = idx - i;
  const ci = colors[Math.min(i, colors.length - 1)];
  const cj = colors[Math.min(i + 1, colors.length - 1)];
  return new THREE.Color(ci).lerp(new THREE.Color(cj), f);
}

function createAisleDoubleDoor(x, zCenter, zSpan, height) {
  const group = new THREE.Group();
  const thickness = 0.05;
  const gap = 0.04;
  const leafDepth = Math.max((zSpan - gap) / 2, 0.12);
  const panelH = height * 0.96;
  const doorMat = new THREE.MeshStandardMaterial({
    color: 0x475569,
    roughness: 0.35,
    metalness: 0.1,
    transparent: true,
    opacity: 0.3,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const frameMat = new THREE.MeshStandardMaterial({
    color: 0x334155,
    roughness: 0.4,
    metalness: 0.18,
    transparent: true,
    opacity: 0.42,
    depthWrite: false,
  });
  const handleMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.45, metalness: 0.4 });

  for (const sign of [-1, 1]) {
    const leaf = new THREE.Group();
    const panel = new THREE.Mesh(new THREE.BoxGeometry(thickness, panelH, leafDepth), doorMat);
    panel.castShadow = false;
    panel.receiveShadow = true;
    leaf.add(panel);
    const edge = new THREE.Mesh(new THREE.BoxGeometry(thickness * 1.08, panelH, 0.02), frameMat);
    edge.position.z = sign * (leafDepth / 2 - 0.01);
    leaf.add(edge);
    const handle = new THREE.Mesh(new THREE.BoxGeometry(thickness * 0.45, panelH * 0.1, 0.03), handleMat);
    handle.position.set(sign * thickness * 0.35, -panelH * 0.05, -sign * leafDepth * 0.25);
    leaf.add(handle);
    leaf.position.set(x, getRackBaseY(), zCenter + sign * (leafDepth / 2 + gap / 2));
    group.add(leaf);
  }

  return group;
}

function createUnifiedAirConditionerWall() {

  const unitD = totalD * 0.96;

  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.58, metalness: 0.06 });
  const ventMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.62, metalness: 0.1 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0xbfc4cc, roughness: 0.48, metalness: 0.14 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(unitW, unitH, unitD), bodyMat);
  body.castShadow = true;

  const ventH = unitH * 0.52;

  vent.position.set(-unitW / 2 - 0.018, unitH * 0.06, 0);

  for (let i = 0; i < 6; i++) {
    const slat = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.012, unitD * 0.78), trimMat);

function rackHasCoolingLoad(row, col) {

function buildCoolingFlowCurves() {
  const curves = { coldAisle: [], coldRack: [], hot: [] };
  const { rackD: d, rackH: h } = C;
  const baseY = getRackBaseY();
  const acVentX = getACVentX();
  const xMin = -C.totalW / 2 + C.rackW * 0.35;
  const hotTopY = baseY + h * 1.08;

  function addColdAisle(zCenter, aisleHalf) {
    const acVentY = getACVentY();
    const floorY = 0.14;
    [-0.36, 0, 0.36].forEach(offset => {
      const zLane = zCenter + aisleHalf * offset;
      curves.coldAisle.push(new THREE.CubicBezierCurve3(
        new THREE.Vector3(acVentX, acVentY, zLane),
        new THREE.Vector3(C.totalW * 0.28, acVentY * 0.8 + floorY * 0.2, zLane),
        new THREE.Vector3(-C.totalW * 0.12, acVentY * 0.35 + floorY * 0.65, zLane),
        new THREE.Vector3(xMin, floorY, zLane)
      ));
    });
  }

  if (C.rows > 0) {
    const edgeAisleHalf = Math.max(C.coldAisleSpacing, 0.4) * 0.85 * 0.5;
    const firstZ = getRackPos(0, 0).z;
    const firstColdZ = firstZ - d / 2 - C.coldAisleSpacing / 2;
    const lastRow = C.rows - 1;
    const lastZ = getRackPos(lastRow, 0).z;
    const lastColdZ = lastZ + d / 2 + C.coldAisleSpacing / 2;

    addColdAisle(firstColdZ, edgeAisleHalf);
    addColdAisle(lastColdZ, edgeAisleHalf);

    for (let c = 0; c < C.cols; c++) {
      const firstX = getRackPos(0, c).x;
      if (rackHasCoolingLoad(0, c)) {
        curves.coldRack.push(new THREE.CubicBezierCurve3(
          new THREE.Vector3(firstX, baseY + 0.12, firstColdZ),
          new THREE.Vector3(firstX, baseY + h * 0.08, firstColdZ + edgeAisleHalf * 0.2),
          new THREE.Vector3(firstX, baseY + h * 0.12, firstZ - d * 0.5),
          new THREE.Vector3(firstX, baseY + h * 0.16, firstZ - d * 0.36)
        ));
      }

      const lastX = getRackPos(lastRow, c).x;
      if (rackHasCoolingLoad(lastRow, c)) {
        curves.coldRack.push(new THREE.CubicBezierCurve3(
          new THREE.Vector3(lastX, baseY + 0.12, lastColdZ),
          new THREE.Vector3(lastX, baseY + h * 0.08, lastColdZ - edgeAisleHalf * 0.2),
          new THREE.Vector3(lastX, baseY + h * 0.12, lastZ + d * 0.5),
          new THREE.Vector3(lastX, baseY + h * 0.16, lastZ + d * 0.36)
        ));
      }
    }
  }

  for (let r = 0; r < C.rows - 1; r++) {
    const zBack = getRackPos(r, 0).z + d / 2;
    const zFront = getRackPos(r + 1, 0).z - d / 2;
    const zCenter = (zBack + zFront) / 2;
    const aisleHalf = Math.max(zFront - zBack, C.coldAisleSpacing * 0.85) * 0.5;

    if (r % 2 === 1) {
      addColdAisle(zCenter, aisleHalf);
    }

    for (let c = 0; c < C.cols; c++) {
      const x = getRackPos(r, c).x;
      const zR = getRackPos(r, c).z;
      const zNext = getRackPos(r + 1, c).z;
      const hasRack = rackHasCoolingLoad(r, c);
      const hasNextRack = rackHasCoolingLoad(r + 1, c);

      if (r % 2 === 1) {
        if (hasRack) {
          curves.coldRack.push(new THREE.CubicBezierCurve3(
            new THREE.Vector3(x, baseY + 0.12, zCenter - aisleHalf * 0.18),
            new THREE.Vector3(x, baseY + h * 0.08, zCenter - aisleHalf * 0.28),
            new THREE.Vector3(x, baseY + h * 0.12, zR + d * 0.5),
            new THREE.Vector3(x, baseY + h * 0.16, zR + d * 0.36)
          ));
        }
        if (hasNextRack) {
          curves.coldRack.push(new THREE.CubicBezierCurve3(
            new THREE.Vector3(x, baseY + 0.12, zCenter + aisleHalf * 0.18),
            new THREE.Vector3(x, baseY + h * 0.08, zCenter + aisleHalf * 0.28),
            new THREE.Vector3(x, baseY + h * 0.12, zNext - d * 0.5),
            new THREE.Vector3(x, baseY + h * 0.16, zNext - d * 0.36)
          ));
        }
      } else {
        if (hasRack) {
          curves.hot.push(new THREE.CubicBezierCurve3(
            new THREE.Vector3(x, baseY + h * 0.5, zR + d * 0.47),
            new THREE.Vector3(x, baseY + h * 0.62, zCenter - aisleHalf * 0.2),
            new THREE.Vector3(x, baseY + h * 0.92, zCenter),
            new THREE.Vector3(x, hotTopY, zCenter)
          ));
        }
        if (hasNextRack) {
          curves.hot.push(new THREE.CubicBezierCurve3(
            new THREE.Vector3(x, baseY + h * 0.5, zNext - d * 0.47),
            new THREE.Vector3(x, baseY + h * 0.62, zCenter + aisleHalf * 0.2),
            new THREE.Vector3(x, baseY + h * 0.92, zCenter),
            new THREE.Vector3(x, hotTopY, zCenter)
          ));
        }
      }
    }
  }
  return curves;
}

function buildCoolingFlowEffects() {
  disposeCoolingFlowEffects();
  if (C.rows < 2) return;

  const flowCurves = buildCoolingFlowCurves();
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speedMul = reducedMotion ? 0.45 : 1;
  const coldAisleCount = flowCurves.coldAisle.length ? (reducedMotion ? 90 : Math.min(360, flowCurves.coldAisle.length * 36)) : 0;
  const coldRackCount = flowCurves.coldRack.length ? (reducedMotion ? 90 : Math.min(520, flowCurves.coldRack.length * 4)) : 0;
  const hotCount = flowCurves.hot.length ? (reducedMotion ? 80 : Math.min(420, flowCurves.hot.length * 3)) : 0;

  const coldFlows = [];
  const hotFlows = [];

  function addFlowPool(target, type, count, curves, colorHex, speedBase, delayStart = 0, delaySpan = 0) {
    if (!curves.length || count <= 0) return;
    const color = new THREE.Color(colorHex);
    for (let i = 0; i < count; i++) {
      target.push({
        type,
        curve: curves[i % curves.length],
        t: 0,
        delay: delayStart + (count > 1 ? (i / (count - 1)) * delaySpan : 0),
        speed: (speedBase + Math.random() * speedBase * 0.55) * speedMul,
        phase: Math.random() * Math.PI * 2,
        color,
      });
    }
  }

  addFlowPool(coldFlows, 'coldAisle', coldAisleCount, flowCurves.coldAisle, 0x0ea5e9, 0.11, 0, 1.2);
  addFlowPool(coldFlows, 'coldRack', coldRackCount, flowCurves.coldRack, 0x38bdf8, 0.3, 0.8, 0.8);
  addFlowPool(hotFlows, 'hot', hotCount, flowCurves.hot, 0xef4444, 0.24, 1.4, 0.8);

  const cubeSize = 0.045;
  const cubeGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);

  function createCubeMesh(count, baseColor, opacity) {
    const mat = new THREE.MeshBasicMaterial({
      color: baseColor,
      transparent: true,
      opacity,
      depthWrite: false,
    });
    const mesh = new THREE.InstancedMesh(cubeGeo, mat, count);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const init = new THREE.Object3D();
    init.scale.setScalar(0);
    init.updateMatrix();
    for (let i = 0; i < count; i++) mesh.setMatrixAt(i, init.matrix);
    mesh.instanceMatrix.needsUpdate = true;
    return mesh;
  }

  const coldCubes = createCubeMesh(coldFlows.length, 0x0ea5e9, 0.82);
  const hotCubes = createCubeMesh(hotFlows.length, 0xef4444, 0.8);

  coolingFlowGroup = new THREE.Group();
  coolingFlowGroup.visible = C.currentView === 'cooling';
  coolingFlowGroup.add(coldCubes, hotCubes);
  scene.add(coolingFlowGroup);

  coolingFlowState = {
    coldFlows, hotFlows, coldCubes, hotCubes, cubeGeo,
  };
  coolingFlowClock.start();
}

const coolingFlowTmp = new THREE.Vector3();
const coolingFlowDummy = new THREE.Object3D();

function setCoolingFlowVisible(visible) {
  if (visible) {
    if (!coolingFlowState) buildCoolingFlowEffects();
  } else {
    disposeCoolingFlowEffects();
  }
}

function updateCoolingFlowEffects(dt) {
  if (!coolingFlowState || !coolingFlowGroup?.visible) return;
  const { coldFlows, hotFlows, coldCubes, hotCubes } = coolingFlowState;

  function updateCubeInstances(mesh, flowList) {
    flowList.forEach((f, i) => {
      if (f.delay > 0) {
        f.delay = Math.max(0, f.delay - dt);
        coolingFlowDummy.scale.setScalar(0);
        coolingFlowDummy.updateMatrix();
        mesh.setMatrixAt(i, coolingFlowDummy.matrix);
        return;
      }

      f.t += f.speed * dt;
      if (f.t >= 1) f.t -= 1;

      f.curve.getPoint(f.t, coolingFlowTmp);
      const wobble = Math.sin(f.phase + f.t * 13) * (f.type === 'hot' ? 0.018 : 0.028);
      coolingFlowTmp.x += wobble;

      let alpha = 1;
      if (f.type === 'coldRack') {
        alpha = f.t < 0.1 ? f.t / 0.1 : f.t > 0.86 ? (1 - f.t) / 0.14 : 1;
      } else if (f.type === 'hot') {
        alpha = f.t < 0.08 ? f.t / 0.08 : f.t > 0.78 ? Math.max(0, (1 - f.t) / 0.22) : 1;
      }

      coolingFlowDummy.position.copy(coolingFlowTmp);
      coolingFlowDummy.rotation.set(
        f.phase + f.t * Math.PI * 2,
        f.phase * 0.7 + f.t * Math.PI,
        f.phase * 0.4 + f.t * Math.PI * 1.5
      );
      coolingFlowDummy.scale.setScalar(Math.max(0.12, alpha) * (f.type === 'coldAisle' ? 0.85 : 1));
      coolingFlowDummy.updateMatrix();
      mesh.setMatrixAt(i, coolingFlowDummy.matrix);
    });
    mesh.instanceMatrix.needsUpdate = true;
  }

  updateCubeInstances(coldCubes, coldFlows);
  updateCubeInstances(hotCubes, hotFlows);
}

function createRack(row, col) {
  const type = computeRackType(row, col, store.rules);
  const devices = getRackDevices(row, col);
  const power = calcRackPower(devices);
  const usedU = calcRackUsedU(devices);
  const { rackW: rw, rackD: rd, rackH: rh } = C;

  const matchedTypes = computeMatchingRuleTypes(row, col, store.rules);

  const group = new THREE.Group();
  group.userData = {
    row, col, type, power, devices, usedU,
    matchedTypes,
  };

  addRackBodyMeshes(group, row, col, matchedTypes, type, rw, rh, rd);

  for (let side = -1; side <= 1; side += 2) {
    for (let yi = -1; yi <= 1; yi += 2) {
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(rw * 0.90, rh * 0.03, rd * 0.04),
        new THREE.MeshStandardMaterial({
          color: getRackAccentColor(row, col, matchedTypes, type, yi),
          roughness: 0.3, metalness: 0.4,
        })
      );
      strip.userData.rackColorPart = 'accent';
      strip.userData.ySign = yi;
      strip.position.set(0, yi * rh * 0.42, side * rd * 0.5);
      group.add(strip);
    }
  }

  if (devices.length > 0) {
    const totalU = devices.reduce((a, d) => a + d.u * d.qty, 0);
    const fillRatio = Math.min(totalU / C.rackU, 1);
    const fillH = rh * fillRatio * 0.85;
    const fillW = rw * 0.7;
    const fillMat = new THREE.MeshStandardMaterial({
      color: type === 'ai' ? 0x60a5fa : type === 'bus' ? 0x34d399 : 0xfbbf24,
      transparent: true, opacity: 0.15, roughness: 0.5,
    });
    const fillMesh = new THREE.Mesh(new THREE.BoxGeometry(fillW, fillH, 0.01), fillMat);
    fillMesh.position.set(0, -rh * 0.42 + fillH / 2, rd * 0.5 + 0.005);
    group.add(fillMesh);

    for (let u = 1; u < Math.min(C.rackU, 20); u++) {
      const ratio = u / C.rackU;
      const ym = -rh * 0.47 + ratio * rh * 0.94;
      const markerMat = new THREE.LineBasicMaterial({ color: 0xa8a29e, transparent: true, opacity: 0.45 });
      const marker = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-rw * 0.4, ym, rd * 0.5 + 0.008),
          new THREE.Vector3(rw * 0.4, ym, rd * 0.5 + 0.008)
        ]),
        markerMat
      );
      group.add(marker);
    }
  }

  const pos = getRackPos(row, col);
  group.position.set(pos.x, getRackBaseY(), pos.z);
  return group;
}

function getAisleSpacingBetweenRows(rowIndex) {
  return rowIndex % 2 === 0 ? C.hotAisleSpacing : C.coldAisleSpacing;
}

function computeTotalDepth() {
  let totalD = C.rows * C.rackD;
  for (let r = 0; r < C.rows - 1; r++) {
    totalD += getAisleSpacingBetweenRows(r);
  }
  return totalD;
}

function formatTotalDepthLabel(totalD) {
  return `总长度=${totalD.toFixed(1)}m`;
}

function createDepthDimensionLabel(text, x, y, z) {
  const floatEl = document.createElement('div');
  floatEl.textContent = text;
  floatEl.style.color = '#2563eb';
  floatEl.style.fontSize = '12px';
  floatEl.style.fontWeight = '700';
  floatEl.style.fontFamily = 'monospace';
  floatEl.style.textShadow = '0 1px 2px rgba(255,255,255,0.9)';
  floatEl.style.whiteSpace = 'nowrap';
  const floatLb = new CSS2DObject(floatEl);
  floatLb.position.set(x, y, z);
  labelGroup.add(floatLb);
}

function getRackPos(row, col) {
  const mirroredCol = C.cols - 1 - col;
  const x = mirroredCol * C.rackW - C.totalW / 2 + C.rackW / 2;
  let z = -C.totalD / 2 + C.rackD / 2;
  for (let r = 0; r < row; r++) {
    z += C.rackD + getAisleSpacingBetweenRows(r);
  }
  return { x, z };
}

function getRackBaseY() {
  return C.rackH * 0.96 / 2;
}

// ======================================================================
// Power coloring
// ======================================================================
let powerRange = { min: 0, max: 1 };

function computePowerRange() {
  let maxP = 0, minP = Infinity;
  for (let r = 0; r < C.rows; r++) {
    for (let c = 0; c < C.cols; c++) {
      const p = calcRackPower(getRackDevices(r, c));
      if (p > maxP) maxP = p;
      if (p < minP) minP = p;
    }
  }
  if (maxP === minP) { minP = 0; maxP = maxP || 1; }
  powerRange = { min: minP, max: maxP };
}

function recolorRacks() {
  computePowerRange();
  for (const group of allRackGroups) {
    const ud = group.userData;
    const type = computeRackType(ud.row, ud.col, store.rules);
    const devices = getRackDevices(ud.row, ud.col);
    ud.type = type;
    ud.devices = devices;
    ud.power = calcRackPower(devices);
    ud.usedU = calcRackUsedU(devices);
    ud.matchedTypes = computeMatchingRuleTypes(ud.row, ud.col, store.rules);
    let color;
    const p = ud.power || 0;
    const isZeroPower = C.colorMode === 'power' && p <= 0;
    if (C.colorMode === 'power') {
      const t = powerRange.max > powerRange.min ? (p - powerRange.min) / (powerRange.max - powerRange.min) : 0;
      color = isZeroPower ? ZERO_POWER_COLOR : interpolateColor(PWR_COLORS, t);
    } else {
      color = null;
    }
    applyRackTypeColor(group, ud, color);
    ud.type = type;
  }
}

function formatDeviceSummary(devices) {
  return devices.map(d => `${d.name} × ${d.qty} · ${(d.power * d.qty).toLocaleString()} W`).join('；');
}

function showRackTooltip(ud, clientX, clientY) {
  const tagStyles = {
    ai: 'background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;',
    bus: 'background:#d1fae5;color:#065f46;border:1px solid #a7f3d0;',
    normal: 'background:#fef9c3;color:#854d0e;border:1px solid #fde047;',
    empty: 'background:#e7e5e4;color:#44403c;border:1px solid #d6d3d1;',
  };
  const matchedTypes = ud.matchedTypes || computeMatchingRuleTypes(ud.row, ud.col, store.rules);
  const shared = matchedTypes.length > 1;
  const displayType = isEmptyNormalRack(ud.row, ud.col, ud.type) ? 'empty' : ud.type;

  document.getElementById('tt-name').textContent =
    `排 ${ud.row + 1} · 第 ${ud.col + 1} 柜`;
  document.getElementById('tt-pos').textContent =
    `Row ${ud.row + 1}, Col ${ud.col + 1} · 合计 ${(ud.power || 0).toLocaleString()} W · ${(ud.usedU || 0)}/${C.rackU} U`;

  const singleTagWrap = document.getElementById('tt-single-tag');
  const sectionsEl = document.getElementById('tt-sections');
  const pwrEl = document.getElementById('tt-pwr');

  if (shared) {
    singleTagWrap.style.display = 'none';
    sectionsEl.innerHTML = matchedTypes.map(type => {
      const devices = getTooltipDevices(type, true);
      return `
        <div class="tt-section">
          <div class="tt-section-head"><span class="tt-tag" style="${tagStyles[type] || tagStyles.normal}">${getTooltipTypeLabel(type, true)}</span></div>
          <div class="tt-section-body">${formatDeviceSummary(devices)}<br>${calcRackUsedU(devices)} U · ${calcRackPower(devices).toLocaleString()} W</div>
        </div>`;
    }).join('') + `<div class="tt-shared">${matchedTypes.includes('ai') && matchedTypes.includes('normal') ? 'AI 与 Leaf交换机共用此机柜' : '多种设备规则叠加，共用此机柜'}</div>`;
    pwrEl.textContent = '';
  } else {
    singleTagWrap.style.display = '';
    sectionsEl.innerHTML = '';
    const tag = document.getElementById('tt-tag');
    tag.textContent = getTooltipTypeLabel(displayType, false);
    tag.style.cssText = tagStyles[displayType] || tagStyles.normal;
    pwrEl.textContent = `⚡ ${(ud.power || 0).toLocaleString()} W · ${(ud.usedU || 0)}/${C.rackU} U`;
  }

  let px = clientX + 14, py = clientY + 14;
  if (px + 220 > window.innerWidth - 10) px = clientX - 230;
  if (py + 140 > window.innerHeight - 10) py = clientY - 150;
  tooltip.style.left = px + 'px';
  tooltip.style.top = py + 'px';
  tooltip.classList.add('show');
}

// ======================================================================
// Build scene
// ======================================================================
function buildScene() {
  C.rackH = C.rackU * C.uMm / 1000;
  C.totalW = C.cols * C.rackW;
  C.totalD = computeTotalDepth();

  if (rackGroup) { scene.remove(rackGroup); disposeGroup(rackGroup); }
  if (measureGroup) { scene.remove(measureGroup); disposeGroup(measureGroup); }
  if (labelGroup) { scene.remove(labelGroup); disposeGroup(labelGroup); }
  if (aisleDoorGroup) { scene.remove(aisleDoorGroup); disposeGroup(aisleDoorGroup); }
  if (hotAisleGroup) { scene.remove(hotAisleGroup); disposeGroup(hotAisleGroup); }
  if (coldAisleGroup) { scene.remove(coldAisleGroup); disposeGroup(coldAisleGroup); }
  if (acGroup) { scene.remove(acGroup); disposeGroup(acGroup); }
  disposeCoolingFlowEffects();
  clearLabelRendererDom();

  rackGroup = new THREE.Group();
  measureGroup = new THREE.Group();
  labelGroup = new THREE.Group();
  scene.add(rackGroup); scene.add(measureGroup); scene.add(labelGroup);

  makeFloor(); makeGrid();

  allRackGroups = [];
  for (let r = 0; r < C.rows; r++) {
    for (let c = 0; c < C.cols; c++) {
      const rack = createRack(r, c);
      rackGroup.add(rack);
      allRackGroups.push(rack);
    }
  }

  recolorRacks();
  buildAisleDoors();
  buildHotAisles();
  buildColdAisles();
  buildACUnits();
  buildMeasurements();
  buildRowLabels();
  applyRowFilter();
  updateStats();
  updateViewList();
  saveState();
}

function disposeGroup(g) {
  g.traverse(child => {
    if (child.element instanceof HTMLElement) {
      child.element.remove();
    }
    if (child.isMesh) { child.geometry?.dispose(); if (Array.isArray(child.material)) child.material.forEach(m => m.dispose()); else child.material?.dispose(); }
    if (child.isLineSegments || child.isLine) { child.geometry?.dispose(); child.material?.dispose(); }
  });
}

function clearLabelRendererDom() {
  if (labelRenderer?.domElement) labelRenderer.domElement.replaceChildren();
}

// ======================================================================
// Measurements
// ======================================================================
function buildMeasurements() {
  const mg = measureGroup;
  const { totalW, totalD, rackW, rackD, coldAisleSpacing, hotAisleSpacing, rows, cols } = C;
  const halfW = totalW / 2, halfD = totalD / 2;
  const off = 1.6, Y = 0.015;
  const dimColor = 0x3b82f6;
  const dm = new THREE.LineBasicMaterial({ color: dimColor, transparent: true, opacity: 0.5 });
  const tkm = new THREE.LineBasicMaterial({ color: dimColor, transparent: true, opacity: 0.4 });
  const gdm = new THREE.LineDashedMaterial({ color: dimColor, transparent: true, opacity: 0.12, dashSize: 0.08, gapSize: 0.06 });

  function line(a, b, mat) { const g = new THREE.BufferGeometry().setFromPoints([a, b]); mg.add(new THREE.Line(g, mat)); }
  function tickAt(pos, dir, sz = 0.15) { const p1 = pos.clone().add(dir.clone().multiplyScalar(-sz)); const p2 = pos.clone().add(dir.clone().multiplyScalar(sz)); line(p1, p2, tkm); }
  function mkLabel(text, x, y, z, style = '') {
    const d = document.createElement('div');
    d.textContent = text;
    d.style.color = style === 'hl' ? '#2563eb' : style === 'val' ? '#3b82f6' : '#78716c';
    d.style.fontSize = style === 'hl' || style === 'val' ? '12px' : '10px';
    d.style.fontWeight = style === 'hl' || style === 'val' ? '700' : '500';
    d.style.fontFamily = 'monospace';
    d.style.textShadow = '0 1px 2px rgba(255,255,255,0.9)';
    const lb = new CSS2DObject(d);
    lb.position.set(x, y, z);
    labelGroup.add(lb);
  }

  const tz = -halfD - off;
  line(new THREE.Vector3(-halfW, Y, tz), new THREE.Vector3(halfW, Y, tz), dm);
  tickAt(new THREE.Vector3(-halfW, Y, tz), new THREE.Vector3(0, 0, 1));
  tickAt(new THREE.Vector3(halfW, Y, tz), new THREE.Vector3(0, 0, 1));
  line(new THREE.Vector3(-halfW + rackW / 2, Y, -halfD), new THREE.Vector3(-halfW, Y, tz), gdm);
  line(new THREE.Vector3(halfW - rackW / 2, Y, -halfD), new THREE.Vector3(halfW, Y, tz), gdm);
  mkLabel(`总宽度 = ${cols}柜 × ${rackW}m = ${totalW.toFixed(1)}m`, 0, Y + 0.8, tz, 'hl');

  const rx = halfW + off;
  const r0z = getRackPos(0, 0).z;
  const r1z = getRackPos(1, 0).z;
  line(new THREE.Vector3(rx, Y, r0z + rackD / 2), new THREE.Vector3(rx, Y, r1z - rackD / 2), dm);
  tickAt(new THREE.Vector3(rx, Y, r0z + rackD / 2), new THREE.Vector3(-1, 0, 0));
  tickAt(new THREE.Vector3(rx, Y, r1z - rackD / 2), new THREE.Vector3(-1, 0, 0));
  line(new THREE.Vector3(halfW - rackW / 2, Y, r0z + rackD / 2), new THREE.Vector3(rx, Y, r0z + rackD / 2), gdm);
  line(new THREE.Vector3(halfW - rackW / 2, Y, r1z - rackD / 2), new THREE.Vector3(rx, Y, r1z - rackD / 2), gdm);

  const rx2 = halfW + off + 2.2;
  line(new THREE.Vector3(rx2, Y, -halfD), new THREE.Vector3(rx2, Y, halfD), dm);
  tickAt(new THREE.Vector3(rx2, Y, -halfD), new THREE.Vector3(-1, 0, 0), 0.2);
  tickAt(new THREE.Vector3(rx2, Y, halfD), new THREE.Vector3(-1, 0, 0), 0.2);
  line(new THREE.Vector3(halfW - rackW / 2, Y, -halfD + rackD / 2), new THREE.Vector3(rx2, Y, -halfD), gdm);
  line(new THREE.Vector3(halfW - rackW / 2, Y, halfD - rackD / 2), new THREE.Vector3(rx2, Y, halfD), gdm);
  createDepthDimensionLabel(
    formatTotalDepthLabel(totalD),
    getAcRackAisleCenterX(),
    getRackBaseY() + C.rackH * 0.34,
    0
  );

  const m = 0.3;
  const pts = [
    new THREE.Vector3(-halfW - m, Y, -halfD - m),
    new THREE.Vector3( halfW + m, Y, -halfD - m),
    new THREE.Vector3( halfW + m, Y,  halfD + m),
    new THREE.Vector3(-halfW - m, Y,  halfD + m),
    new THREE.Vector3(-halfW - m, Y, -halfD - m),
  ];
  const pg = new THREE.BufferGeometry().setFromPoints(pts);
  const pl = new THREE.Line(pg, gdm);
  pl.computeLineDistances();
  mg.add(pl);
}

function buildRowLabels() {
  const halfW = C.totalW / 2;
  for (let r = 0; r < C.rows; r++) {
    const pos = getRackPos(r, 0);
    const d = document.createElement('div');
    d.textContent = `排 ${r + 1}`;
    d.style.color = '#57534e';
    d.style.fontSize = '11px';
    d.style.fontWeight = '500';
    d.style.fontFamily = 'monospace';
    d.style.textShadow = 'none';
    d.style.background = 'rgba(255,255,255,0.88)';
    d.style.padding = '1px 8px';
    d.style.borderRadius = '3px';
    d.style.border = '1px solid #e7e5e4';
    const lb = new CSS2DObject(d);
    lb.position.set(-halfW - 1.0, getRackBaseY() + 0.4, pos.z);
    labelGroup.add(lb);
  }
}

// ======================================================================
// Row filter
// ======================================================================
function applyRowFilter() {
  for (const group of allRackGroups) {
    group.visible = C.filterRow < 0 || group.userData.row === C.filterRow;
  }
}

// ======================================================================
// Camera views
// ======================================================================
function setView(name, animate = true) {
  C.currentView = name;
  const { totalW, totalD, rackH } = C;
  const center = new THREE.Vector3(0, 0, 0);
  let pos;
  switch (name) {
    case 'top': pos = new THREE.Vector3(0, Math.max(totalW, totalD) * 0.9 + 6, 0.01); break;
    case 'horiz': {
      const r = Math.min(2, C.rows - 1);
      const p = getRackPos(r, 0);
      pos = new THREE.Vector3(0, getRackBaseY() + rackH * 0.5, p.z + totalW * 0.7 + 2);
      center.set(0, getRackBaseY() + rackH * 0.3, p.z);
      break;
    }
    default: pos = new THREE.Vector3(totalW * 0.6 + 5, Math.max(totalW, totalD) * 0.5 + 3, totalD * 0.6 + 5); break;
  }
  if (name === 'top') center.set(0, 0, 0);
  setCoolingFlowVisible(name === 'cooling');
  if (!animate) { camera.position.copy(pos); controls.target.copy(center); controls.update(); return; }
  const sp = camera.position.clone(), st = controls.target.clone();
  const dur = 700, t0 = performance.now();
  function anim(t) {
    const p = Math.min((t - t0) / dur, 1);
    const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    camera.position.lerpVectors(sp, pos, e);
    controls.target.lerpVectors(st, center, e);
    controls.update();
    if (p < 1) requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

// ======================================================================
// Stats
// ======================================================================
function updateStats() {
  let ai = 0, bus = 0, totalPwr = 0;
  for (const g of allRackGroups) {
    const t = computeRackType(g.userData.row, g.userData.col, store.rules);
    if (t === 'ai') ai++; else if (t === 'bus') bus++;
    totalPwr += g.userData.power || 0;
  }
  statRacks.textContent = allRackGroups.length + ' 柜';
  statAi.textContent = ai + ' AI';
  statPwr.textContent = (totalPwr / 1000).toFixed(1) + ' kW';
  statDims.textContent = `${C.totalW.toFixed(1)}×${C.totalD.toFixed(1)} m`;
}

// ======================================================================
// Rules UI
// ======================================================================
let editingRuleIndex = -1;

function renderRules() {
  const el = document.getElementById('rule-list');
  const types = { ai: '🔵 AI 设备', bus: '🟢 总线柜', normal: '🟡 Leaf交换机' };
  const dots = { ai: '#3b82f6', bus: '#10b981', normal: '#f59e0b' };
  if (store.rules.length === 0) {
    el.innerHTML = '<div style="font-size:11px;color:#475569;padding:8px;">暂未添加规则，所有机柜默认为空机柜。<br>点击下方"+ 添加规则"创建。</div>';
    setRuleInputsLocked(rulesLocked);
    return;
  }
  el.innerHTML = store.rules.map((rule, i) => `
    <div class="rule-item${rule.enabled ? '' : ' disabled'}">
      <span class="r-dot" style="background:${dots[rule.type] || '#6b7280'}"></span>
      <div class="r-info">
        <div class="r-title">${rule.name || '未命名规则'}</div>
        <div class="r-desc">第 ${rule.rows} 排 → 第 ${rule.cols} 柜 → ${types[rule.type]}</div>
      </div>
      <div class="r-actions">
        <button class="btn-sm btn-outline" data-ri="${i}" data-action="edit" ${rulesLocked ? 'disabled' : ''} style="font-size:9px;padding:2px 5px;">✏️</button>
        <button class="btn-sm ${rule.enabled ? 'btn-success' : 'btn-outline'}" data-ri="${i}" data-action="toggle" ${rulesLocked ? 'disabled' : ''} style="font-size:9px;padding:2px 5px;">${rule.enabled ? 'ON' : 'OFF'}</button>
        <button class="btn-sm btn-danger" data-ri="${i}" data-action="delete" ${rulesLocked ? 'disabled' : ''} style="font-size:9px;padding:2px 5px;">✕</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (rulesLocked) return;
      const i = parseInt(btn.dataset.ri);
      if (btn.dataset.action === 'toggle') {
        store.rules[i].enabled = !store.rules[i].enabled;
        rebuildAfterRuleChange();
        renderRules();
        toast(store.rules[i].enabled ? '规则已启用' : '规则已禁用');
      } else if (btn.dataset.action === 'delete') {
        store.rules.splice(i, 1);
        if (editingRuleIndex === i) editingRuleIndex = -1;
        else if (editingRuleIndex > i) editingRuleIndex--;
        rebuildAfterRuleChange();
        renderRules();
        toast('规则已删除', 'warn');
      } else if (btn.dataset.action === 'edit') {
        openRuleEditor(i);
      }
    });
  });
  setRuleInputsLocked(rulesLocked);
}

function setRuleInputsLocked(locked) {
  ['rule-rows', 'rule-cols', 'rule-type', 'rule-name', 'rule-save', 'rule-cancel', 'rule-add-btn'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = locked;
  });
  const btn = document.getElementById('btn-unlock-rules');
  if (btn) {
    btn.textContent = locked ? '解锁' : '提交';
    btn.setAttribute('aria-pressed', locked ? 'false' : 'true');
  }
}

function setRulesLocked(locked) {
  rulesLocked = locked;
  if (locked) {
    document.getElementById('rule-form')?.classList.remove('open');
    editingRuleIndex = -1;
    const saveBtn = document.getElementById('rule-save');
    if (saveBtn) saveBtn.textContent = '✓';
  }
  renderRules();
}

function openRuleEditor(index) {
  if (rulesLocked) return;
  const rule = store.rules[index];
  editingRuleIndex = index;
  document.getElementById('rule-name').value = rule.name || '';
  document.getElementById('rule-rows').value = rule.rows || '';
  document.getElementById('rule-cols').value = rule.cols || '';
  document.getElementById('rule-type').value = rule.type || 'normal';
  document.getElementById('rule-save').textContent = '✓ 更新';
  document.getElementById('rule-form').classList.add('open');
}

function updateViewList() {
  const el = document.getElementById('view-list');
  if (store.savedViews.length === 0) {
    el.innerHTML = '<div style="font-size:11px;color:#475569;padding:4px;">暂无已保存视角</div>';

}

// ======================================================================
// Interaction
// ======================================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;

function onPointerMove(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = [];
  for (const g of allRackGroups) g.traverse(c => { if (c.isMesh) meshes.push(c); });
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) {
    let g = hits[0].object.parent;
    while (g && g.userData?.row === undefined) g = g.parent;
    if (!g || g.userData.row === undefined) { hideTip(); return; }
    const ud = g.userData;
    showRackTooltip(ud, e.clientX, e.clientY);
    if (hovered && hovered !== g) unhighlight(hovered);
    highlight(g);
    hovered = g;
  } else {
    hideTip();
    renderer.domElement.style.cursor = 'default';
    if (hovered) { unhighlight(hovered); hovered = null; }
  }
}

function highlight(g) {
  g.traverse(c => {
    if (c.isMesh && c.material && !c.material._he) {
      c.material._he = c.material.emissive ? c.material.emissive.getHex() : 0;
      c.material._hei = c.material.emissiveIntensity || 0;
      c.material.emissive = new THREE.Color(0xffffff);
      c.material.emissiveIntensity = 0.25;
    }
  });
}

function unhighlight(g) {
  g.traverse(c => {
    if (c.isMesh && c.material && c.material._he !== undefined) {
      c.material.emissive = new THREE.Color(c.material._he);
      c.material.emissiveIntensity = c.material._hei;
      delete c.material._he; delete c.material._hei;
    }
  });
}

function hideTip() { tooltip.classList.remove('show'); }

// ======================================================================
// Rebuild helpers
// ======================================================================
function rebuildAfterRuleChange() {
  if (rackGroup) {
    while (rackGroup.children.length > 0) {
      const c = rackGroup.children[0];
      rackGroup.remove(c);
      disposeGroup(c);
    }
  }
  allRackGroups = [];
  for (let r = 0; r < C.rows; r++) {
    for (let c = 0; c < C.cols; c++) {
      const rack = createRack(r, c);
      rackGroup.add(rack);
      allRackGroups.push(rack);
    }
  }
  recolorRacks();
  applyRowFilter();
  updateStats();
  saveState();
}

function rebuildFull() {
  buildScene();
}

const layoutInputIds = [
  'cfg-rows', 'cfg-cols', 'cfg-cold-aisle', 'cfg-hot-aisle', 'cfg-depth', 'cfg-depth2', 'cfg-u',
  'cfg-width', 'cfg-umm', 'cfg-w-ai', 'cfg-w-bus', 'cfg-w-norm', 'cfg-w-empty',
];

function setLayoutInputsLocked(locked) {
  layoutInputIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = locked;
  });
  const btn = document.getElementById('btn-unlock-layout');
  if (btn) {
    btn.textContent = locked ? '解锁' : '已解锁';
    btn.setAttribute('aria-pressed', locked ? 'false' : 'true');
  }
}

// ======================================================================
// Init
// ======================================================================
function initUI(fromLocalStorage, configSource) {
  // Sync form fields with state
  document.getElementById('cfg-rows').value = C.rows;
  document.getElementById('cfg-cols').value = C.cols;
  document.getElementById('cfg-cold-aisle').value = C.coldAisleSpacing;
  document.getElementById('cfg-hot-aisle').value = C.hotAisleSpacing;
  document.getElementById('cfg-depth').value = C.rackD;
  document.getElementById('cfg-depth2').value = C.rackD;
  document.getElementById('cfg-u').value = C.rackU;
  document.getElementById('cfg-width').value = C.rackW;
  document.getElementById('cfg-umm').value = C.uMm;
  document.getElementById('cfg-w-ai').value = C.defaultPower.ai;
  document.getElementById('cfg-w-bus').value = C.defaultPower.bus;
  document.getElementById('cfg-w-norm').value = C.defaultPower.normal;
  document.getElementById('cfg-w-empty').value = C.defaultPower.empty;
  setLayoutInputsLocked(true);

  buildScene();
  setView('angle', false);
  renderRules();
  setRulesLocked(true);

  setTimeout(() => {
    if (!fromLocalStorage) setView('angle', true);
  }, 100);

  if (fromLocalStorage) toast('已恢复上次的配置');
  else if (configSource === 'database') toast('已加载云端配置');
  updateConfigSourceBadge();
}

async function boot() {
  const loaded = loadState();
  let configSource = 'local';
  let configVersion = null;

  const pwdResult = await AidcConfig.load('site.unlock_password', LOCAL_UNLOCK_PASSWORD);
  if (pwdResult.data && pwdResult.data.password) {
    unlockPassword = pwdResult.data.password;
  }

  if (!loaded) {
    const result = await AidcConfig.load(CONFIG_KEY, LOCAL_DC3D_DEFAULTS);
    configSource = result.source;
    configVersion = result.version;
    applyRemoteConfig(result.data);
  }
  configLoadMeta = {
    source: configSource,
    version: configVersion,
    fromLocalStorage: loaded,
  };
  initUI(loaded, configSource);
}

// ======================================================================
// Animation loop
// ======================================================================
function animate() {
  requestAnimationFrame(animate);
  updateCoolingFlowEffects(Math.min(coolingFlowClock.getDelta(), 0.05));
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// ======================================================================
// UI Bindings
// ======================================================================
document.querySelectorAll('[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setView(btn.dataset.view, true);
  });
});

document.querySelectorAll('[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    C.colorMode = btn.dataset.mode;
    if (C.colorMode === 'power') computePowerRange();
    recolorRacks();
  });
});

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  sidebar.classList.toggle('closed');
  container.classList.toggle('expanded');
  setTimeout(() => { renderer.setSize(container.clientWidth, container.clientHeight); labelRenderer.setSize(container.clientWidth, container.clientHeight); }, 350);
});

document.querySelectorAll('.sb-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.sb-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sb-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

document.getElementById('btn-unlock-layout').addEventListener('click', async () => {
  const btn = document.getElementById('btn-unlock-layout');
  if (btn.getAttribute('aria-pressed') === 'true') return;
  await promptUnlockPassword(() => {
    setLayoutInputsLocked(false);
    toast('布局参数已解锁');
  });
});

document.getElementById('btn-apply-layout').addEventListener('click', () => {
  const rows = parseInt(document.getElementById('cfg-rows').value) || 8;
  const cols = parseInt(document.getElementById('cfg-cols').value) || 13;
  const coldAisle = parseFloat(document.getElementById('cfg-cold-aisle').value) || 1.6;
  const hotAisle = parseFloat(document.getElementById('cfg-hot-aisle').value) || 1.2;
  const depth = parseFloat(document.getElementById('cfg-depth').value) || 1.0;
  const u = parseInt(document.getElementById('cfg-u').value) || 42;
  const w = parseFloat(document.getElementById('cfg-width').value) || 0.6;
  const umm = parseFloat(document.getElementById('cfg-umm').value) || 42;
  const wAi = parseInt(document.getElementById('cfg-w-ai').value) || 15000;
  const wBus = parseInt(document.getElementById('cfg-w-bus').value) || 7000;
  const wNorm = parseInt(document.getElementById('cfg-w-norm').value) || 300;
  const wEmpty = parseInt(document.getElementById('cfg-w-empty').value) || 0;

  C.rows = rows; C.cols = cols;
  C.coldAisleSpacing = coldAisle;
  C.hotAisleSpacing = hotAisle;
  C.rackD = depth; C.rackU = u; C.rackW = w;
  C.uMm = umm;
  C.defaultPower = { ai: wAi, bus: wBus, normal: wNorm, empty: wEmpty };
  document.getElementById('cfg-depth2').value = depth;

  rebuildFull();
  renderRules();
  saveState();
  setLayoutInputsLocked(true);
  toast('布局已更新并保存');
});

document.getElementById('cfg-depth').addEventListener('input', () => { document.getElementById('cfg-depth2').value = document.getElementById('cfg-depth').value; });
document.getElementById('cfg-depth2').addEventListener('input', () => { document.getElementById('cfg-depth').value = document.getElementById('cfg-depth2').value; });

document.getElementById('btn-unlock-rules').addEventListener('click', async () => {
  if (rulesLocked) {
    await promptUnlockPassword(() => {
      setRulesLocked(false);
      toast('规则已解锁');
    });
    return;
  }
  rebuildAfterRuleChange();
  renderRules();
  setRulesLocked(true);
  toast('规则已提交并保存');
});

document.getElementById('rule-add-btn').addEventListener('click', () => {
  if (rulesLocked) return;
  editingRuleIndex = -1;
  document.getElementById('rule-save').textContent = '✓';
  document.getElementById('rule-name').value = '';
  document.getElementById('rule-rows').value = '';
  document.getElementById('rule-cols').value = '';
  document.getElementById('rule-form').classList.toggle('open');
});

document.getElementById('rule-save').addEventListener('click', () => {
  if (rulesLocked) return;
  const rows = document.getElementById('rule-rows').value.trim();
  const cols = document.getElementById('rule-cols').value.trim();
  const type = document.getElementById('rule-type').value;
  const name = document.getElementById('rule-name').value.trim() || `规则 ${store.rules.length + 1}`;
  if (!rows || !cols) { alert('请填写行和列范围'); return; }

  if (editingRuleIndex >= 0 && editingRuleIndex < store.rules.length) {
    store.rules[editingRuleIndex] = { ...store.rules[editingRuleIndex], name, rows, cols, type };
    editingRuleIndex = -1;
    toast('规则已更新');
  } else {
    store.rules.push({ name, rows, cols, type, enabled: true });
    toast('规则已添加');
  }
  document.getElementById('rule-form').classList.remove('open');
  rebuildAfterRuleChange();
  renderRules();
  toast('规则已保存，请点击提交锁定');
});

document.getElementById('rule-cancel').addEventListener('click', () => {
  if (rulesLocked) return;
  document.getElementById('rule-form').classList.remove('open');
  editingRuleIndex = -1;
  document.getElementById('rule-save').textContent = '✓';
});

document.getElementById('view-save-btn').addEventListener('click', () => {
  const name = document.getElementById('view-name').value.trim() || `视角 ${store.savedViews.length + 1}`;
  store.savedViews.push({
    id: ++store.viewIdx, name,
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z,
  });
  document.getElementById('view-name').value = '';
  updateViewList();
  saveState();
  toast(`视角「${name}」已保存`);
});

document.getElementById('row-filter-btn').addEventListener('click', () => {
  C.filterRow = parseInt(document.getElementById('row-filter-select').value);
  applyRowFilter();
});

document.getElementById('row-filter-clear').addEventListener('click', () => {
  C.filterRow = -1;
  document.getElementById('row-filter-select').value = '-1';
  applyRowFilter();
});

document.getElementById('reset-camera-btn').addEventListener('click', () => {
  setView(C.currentView, true);
});

// Pointer events
renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('pointerleave', () => { hideTip(); if (hovered) { unhighlight(hovered); hovered = null; } });

function onResize() {
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(container);

// Row filter population
function updateRowFilter() {
  const sel = document.getElementById('row-filter-select');
  sel.innerHTML = '<option value="-1">全部显示</option>';
  for (let i = 0; i < C.rows; i++) sel.innerHTML += `<option value="${i}">排 ${i + 1}</option>`;
}
const origBuild = buildScene;
buildScene = function() { origBuild(); updateRowFilter(); };

// ======================================================================
// Start
// ======================================================================
boot();
animate();

console.log('🏭 DataCenter 3D Designer v2 · 案例A（风冷超节点） 已启动');
console.log('• 鼠标左键旋转 | 滚轮缩放 | 右键平移');
console.log('• 悬停查看机柜信息');
console.log('• 配置自动保存到 localStorage');
</script>

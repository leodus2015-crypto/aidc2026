<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#f8fafc" />
  <title>机房布局 · AI Data Center</title>
  <script src="js/aidc-theme.js?v=21"></script>
  <script src="js/theme-switch.js?v=21"></script>
  <script src="js/aidc-asset-version.js?v=21"></script>
<script src="js/embed-mode.js?v=21"></script>
  <link rel="stylesheet" href="css/embed.css?v=21" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/theme.css?v=21" />
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-900" data-i18n-page="ai-dc-room-layout">
  <header class="aidc-chrome sticky top-0 z-10 shrink-0 border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav
      class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-3 px-4 py-3 sm:px-6 lg:px-8 xl:max-w-7xl"
      data-i18n-aria-label="nav.aria"
      aria-label="主导航"
    >
      <a href="index.html" class="flex min-w-0 shrink-0 items-center" data-i18n-aria-label="nav.homeAria" aria-label="AIDC 2026 · 首页">
        <img
          src="aidc2026-logo.svg"
          alt="AIDC 2026 · AI Data Center"
          width="593"
          height="118"
          class="h-8 w-auto max-h-10 object-contain object-left sm:h-9 md:h-10"
        />
      </a>
      <div class="ml-auto flex flex-wrap items-center gap-4">
        <ul class="flex flex-wrap items-center gap-6 text-sm font-semibold">
          <li>
            <a
              href="ai-dc-design.html"
              class="inline-block border-b-2 border-blue-600 pb-1 text-blue-700"
              aria-current="page"
              data-i18n="nav.aiDcLayout"
            >AI DC规划</a>
          </li>
          <li>
            <a
              href="index.html#inference"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.inference"
            >Agentic推理</a>
          </li>
          <li>
            <a
              href="post-training.html"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.postTraining"
            >后训练</a>
          </li>
          <li>
            <a
              href="white-paper.html"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.whitePaper"
            >白皮书</a>
          </li>
          <li>
            <a
              href="about-us.html"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.aboutUs"
            >About US</a>
          </li>
        </ul>
        <div id="lang-switch-root" class="shrink-0"></div>
      </div>
    </nav>
  </header>

  <main class="room-layout-main mx-auto flex w-full max-w-[100rem] flex-1 flex-col gap-6 px-4 py-6 sm:px-6 lg:landscape:flex-row lg:landscape:items-stretch lg:landscape:gap-6 lg:landscape:py-4 xl:landscape:gap-8">
    <section class="room-layout-card flex min-w-0 flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70 lg:landscape:min-h-0 lg:landscape:flex-1">
      <div class="shrink-0 border-b border-slate-100 px-4 py-3 sm:px-5">
        <h2 class="text-sm font-semibold text-slate-800 sm:text-base" data-i18n="cards.fourLayer">四层数据中心示意图</h2>
      </div>
      <iframe
        data-iframe-key="fourLayer"
        data-i18n-title="iframe.fourLayer"
        title="四层数据中心示意图"
        class="room-layout-iframe block h-[min(42vh,28rem)] w-full min-h-[20rem] flex-1 bg-slate-50 lg:landscape:h-auto lg:landscape:min-h-0"
      ></iframe>
    </section>

    <section class="room-layout-card flex min-w-0 flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70 lg:landscape:min-h-0 lg:landscape:flex-1">
      <div class="shrink-0 border-b border-slate-100 px-4 py-3 sm:px-5">
        <h2 class="text-sm font-semibold text-slate-800 sm:text-base" data-i18n="cards.floorDetail">单层详细平面图</h2>
      </div>
      <iframe
        data-iframe-key="floorDetail"
        data-i18n-title="iframe.floorDetail"
        title="单层详细平面图"
        class="room-layout-iframe block h-[min(45vh,32rem)] w-full min-h-[22rem] flex-1 bg-[#f8fafc] lg:landscape:h-auto lg:landscape:min-h-0"
        loading="lazy"
      ></iframe>
    </section>
  </main>

  <footer class="aidc-chrome shrink-0 border-t border-slate-200 bg-white py-6">
    <p class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-center text-sm text-slate-500">
      <span><span data-i18n="footer.miit"></span>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="transition hover:text-slate-700">苏ICP备2026026790号-3</a>
      </span>
      <span class="hidden sm:inline" aria-hidden="true">|</span>
      <span><span data-i18n="footer.publicSecurity"></span>
        <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=32010602012455" target="_blank" rel="noopener noreferrer" class="transition hover:text-slate-700">苏公网安备32010602012455号</a>
      </span>
    </p>
  </footer>

  <script src="js/aidc-locale-bridge.js?v=21"></script>
  <script src="js/i18n.js?v=21"></script>
  <script src="js/lang-switch.js?v=21"></script>
  <script src="js/i18n-bootstrap.js?v=21"></script>
  <script src="js/ai-dc-room-layout-page.js?v=21"></script>
  <script>
    AidcI18nBootstrap.bootstrap('ai-dc-room-layout', {
      onReady: function () {
        AidcAiDcRoomLayoutPage.init();
      },
      onLocaleChange: function () {
        AidcAiDcRoomLayoutPage.syncIframes();
      },
    });
    if (window.AidcLocaleBridge) {
      AidcLocaleBridge.initIframeListener(function (locale) {
        if (window.AidcI18n && AidcI18n.getLocale() !== locale) {
          AidcI18n.setLocale(locale, { page: 'ai-dc-room-layout', common: true, basePath: 'i18n/' });
        }
      }, { selfSource: 'ai-dc-room-layout' });
    }
  </script>
</body>
</html>

  <style>
    .topic-deck-stage {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border-radius: 1.5rem;
      border: 1px solid var(--aidc-border);
      background: #11182c;
      box-shadow: 0 20px 40px var(--aidc-shadow);
    }
    .topic-deck-stage iframe {
      display: block;
      width: 100%;
      min-height: 16rem;
      aspect-ratio: 16 / 9;
      background: #11182c;
    }
    .topic-deck-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem 1rem;
      margin-top: 0.75rem;
    }
    .topic-deck-toolbar p {
      margin: 0;
      min-width: 0;
      flex: 1 1 auto;
    }
    .topic-deck-present {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0;
      padding: 0.28rem 0.6rem;
      border: 1px solid var(--aidc-border);
      border-radius: 0.65rem;
      background: var(--aidc-surface);
      color: var(--aidc-accent-text);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
    }
    .topic-deck-present:hover,
    .topic-deck-present:focus-visible {
      border-color: var(--aidc-accent);
      background: var(--aidc-surface-muted);
    }
    .topic-deck-present:focus-visible {
      outline: 2px solid var(--aidc-accent);
      outline-offset: 2px;
    }
    .topic-deck-present__icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 4px 0 4px 7px;
      border-color: transparent transparent transparent currentColor;
    }
    .topic-deck-exit {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      padding: 0.45rem 0.85rem;
      border: 1px solid rgba(240, 236, 227, 0.28);
      border-radius: 9999px;
      background: rgba(17, 24, 44, 0.72);
      color: #f0ece3;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .topic-deck-exit:hover,
    .topic-deck-exit:focus-visible {
      background: rgba(17, 24, 44, 0.92);
    }
    .topic-deck-exit:focus-visible {
      outline: 2px solid var(--aidc-accent);
      outline-offset: 2px;
    }
    body.is-presenting .topic-deck-stage,
    .topic-deck-stage:fullscreen,
    .topic-deck-stage:-webkit-full-screen {
      position: fixed;
      inset: 0;
      z-index: 80;
      width: 100%;
      height: 100%;
      max-width: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background: #11182c;
    }
    body.is-presenting .topic-deck-stage iframe,
    .topic-deck-stage:fullscreen iframe,
    .topic-deck-stage:-webkit-full-screen iframe {
      width: 100%;
      height: 100%;
      min-height: 0;
      aspect-ratio: auto;
    }
    body.is-presenting > header,
    body.is-presenting > footer,
    body.is-presenting .topic-deck-toolbar,
    body.is-presenting main > section > div:first-child {
      display: none;
    }
    .topic-deck-present[hidden],
    .topic-deck-exit[hidden] {
      display: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .topic-deck-present,
      .topic-deck-exit {
        transition: none;
      }
    }
  </style>

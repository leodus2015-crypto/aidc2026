    html[data-theme="dark"] #buildingSvg [fill="#fef3c7"] { fill: #493819; }
    html[data-theme="dark"] #buildingSvg [fill="#ccfbf1"] { fill: #123d35; }
    html[data-theme="dark"] #buildingSvg [fill="#ede9fe"] { fill: #302758; }
    html[data-theme="dark"] #buildingSvg [fill="#dbeafe"] { fill: #172f50; }
    html[data-theme="dark"] #buildingSvg [fill="#f8fafc"] { fill: #111f32; }

    html[data-theme="dark"] #buildingSvg [fill="#0369a1"] { fill: #7dd3fc; }
    html[data-theme="dark"] #buildingSvg [fill="#92400e"] { fill: #fcd34d; }
    html[data-theme="dark"] #buildingSvg [fill="#115e59"] { fill: #5eead4; }
    html[data-theme="dark"] #buildingSvg [fill="#5b21b6"] { fill: #c4b5fd; }
    html[data-theme="dark"] #buildingSvg [fill="#1d4ed8"] { fill: #93c5fd; }
    html[data-theme="dark"] #buildingSvg [stroke="#cbd5e1"] { stroke: #3c506a; }
    html[data-theme="dark"] #buildingSvg [stroke="#64748b"] { stroke: #91a4bb; }

  <div class="building-stage relative min-h-0 flex-1">
    <svg id="buildingSvg" viewBox="0 0 1000 820" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Four-layer data center floor stack schematic">
      <g id="dimLines" fill="#64748b" font-size="15" font-family="-apple-system,BlinkMacSystemFont,sans-serif"></g>
      <g id="floorGroups"></g>
    </svg>
  </div>

  <script>
    function L(s) {
      if (!s || !window.AidcI18n) return s;
      return AidcI18n.getLookupText(s);
    }
    function applyPtI18nEl(el) {
      var key = el.getAttribute('data-pt-i18n');
      if (!key) return;
      var val = L(key);
      var tspans = el.querySelectorAll('tspan');
      if (tspans.length) {
        val.split('\n').forEach(function (line, i) {
          if (tspans[i]) tspans[i].textContent = line;
        });
      } else {
        el.textContent = val;
      }
    }
    function applyDemoStaticI18n() {
      document.querySelectorAll('[data-pt-i18n]').forEach(applyPtI18nEl);
    }

    const ZONES = {
      hvac: { label: '制冷', fill: '#e0f2fe', stroke: '#0284c7', text: '#0369a1' },
      server: { label: '机房', fill: '#e2e8f0', stroke: '#475569', text: '#334155' },
      electrical: { label: '配电', fill: '#fef3c7', stroke: '#d97706', text: '#92400e' },
      hydraulic: { label: '水力', fill: '#ccfbf1', stroke: '#0d9488', text: '#115e59' },
      battery: { label: '电池', fill: '#ede9fe', stroke: '#7c3aed', text: '#5b21b6' },
      cooling: { label: '冷却塔', fill: '#dbeafe', stroke: '#2563eb', text: '#1d4ed8' },
      tbd: { label: '待定', fill: '#f8fafc', stroke: '#94a3b8', text: '#64748b', dash: '6 4' },
    };

    const ISO = { ox: 280, oy: 720, sx: 92, sy: 53, zStep: 138 };

    function iso(x, y, z) {
      return {
        x: ISO.ox + (x - y) * ISO.sx,
        y: ISO.oy - z * ISO.zStep + (x + y) * ISO.sy,
      };
    }

    function poly(points) {
      return points.map((p) => `${p.x},${p.y}`).join(' ');
    }

    function centroid(points) {
      return {
        x: points.reduce((s, p) => s + p.x, 0) / points.length,
        y: points.reduce((s, p) => s + p.y, 0) / points.length,
      };
    }

    function edgeAngle(p1, p2) {
      let deg = (Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180) / Math.PI;
      if (deg > 90) deg -= 180;
      if (deg < -90) deg += 180;
      return deg;
    }

    function edgeLength(p1, p2) {
      return Math.hypot(p2.x - p1.x, p2.y - p1.y);
    }

    function topFace(z, w, d) {
      return [iso(0, 0, z), iso(w, 0, z), iso(w, d, z), iso(0, d, z)];
    }

    function addAlignedLabel(parent, pts, zoneKey, uncertain) {
      const style = ZONES[zoneKey] || ZONES.tbd;
      const lines = (L(style.label) + (uncertain ? '?' : '')).split('\n');
      const c = centroid(pts);
      const widthEdge = edgeLength(pts[0], pts[1]);
      const depthEdge = edgeLength(pts[0], pts[3]);
      const alongWidth = widthEdge >= depthEdge;
      const angle = alongWidth ? edgeAngle(pts[0], pts[1]) : edgeAngle(pts[0], pts[3]);
      const span = alongWidth ? widthEdge : depthEdge;
      const lineCount = lines.length;
      const fs = Math.min(Math.max(7, span * 0.085), 11);
      const lineHeight = fs * 1.1;

      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('transform', `translate(${c.x},${c.y}) rotate(${angle})`);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('fill', style.text);
      text.setAttribute('font-size', fs);
      text.setAttribute('font-weight', '600');
      text.classList.add('zone-label');

      lines.forEach((line, i) => {
        const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        tspan.setAttribute('x', 0);
        tspan.setAttribute('y', (i - (lineCount - 1) / 2) * lineHeight);
        tspan.textContent = line;
        text.appendChild(tspan);
      });

      parent.appendChild(text);
    }

    function addFloorLabel(parent, floor) {
      const pt = iso(-0.18, D * 0.5, floor.z);
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', pt.x - 10);
      text.setAttribute('y', pt.y);
      text.setAttribute('text-anchor', 'end');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('fill', '#0f172a');
      text.setAttribute('font-size', '18');
      text.setAttribute('font-weight', '700');
      text.classList.add('zone-label');
      text.textContent = floor.label;
      parent.appendChild(text);
    }

    const STANDARD_FLOOR_ROWS = [
      [{ t: 'hvac' }, { t: 'hvac' }],
      [{ t: 'server' }, { t: 'server' }],
      [{ t: 'electrical' }, { t: 'electrical', w: 0.5 }, { t: 'hydraulic', w: 0.5 }],
      [{ t: 'server' }, { t: 'server' }],
      [{ t: 'hvac' }, { t: 'hvac' }],
    ];

    const floors = [
      {
        id: '1f', label: '1F', z: 0, gapLabel: '8.0 m',
        rows: STANDARD_FLOOR_ROWS,
      },
      {
        id: '2f', label: '2F', z: 1, gapLabel: '7.0 m',
        rows: STANDARD_FLOOR_ROWS,
      },
      {
        id: '3f', label: '3F', z: 2, gapLabel: '7.0 m',
        rows: STANDARD_FLOOR_ROWS,
      },
      {
        id: 'rf', label: 'RF', z: 3, gapLabel: null,
        rows: [
          [{ t: 'battery', w: 1 }, null],
          [{ t: 'cooling' }, { t: 'cooling' }],
          [{ t: 'battery', w: 1 }, null],
        ],
      },
    ];

    const W = 2;
    const D = 1.1;
    const floorGroups = document.getElementById('floorGroups');
    const dimLines = document.getElementById('dimLines');

    function zonePolygon(z, x0, y0, w, h) {
      return [
        iso(x0, y0, z), iso(x0 + w, y0, z),
        iso(x0 + w, y0 + h, z), iso(x0, y0 + h, z),
      ];
    }

    function renderFloor(floor) {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.dataset.floor = floor.id;

      const outline = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      outline.setAttribute('points', poly(topFace(floor.z, W, D)));
      outline.setAttribute('fill', floor.uncertain ? 'rgba(248,250,252,0.35)' : 'rgba(255,255,255,0.55)');
      outline.setAttribute('stroke', floor.uncertain ? '#94a3b8' : '#cbd5e1');
      outline.setAttribute('stroke-width', '1.5');
      outline.setAttribute('stroke-dasharray', floor.uncertain ? '8 5' : 'none');
      outline.setAttribute('pointer-events', 'none');
      g.appendChild(outline);

      const rowCount = floor.rows.length;
      floor.rows.forEach((row, ri) => {
        const y0 = (ri / rowCount) * D;
        const y1 = ((ri + 1) / rowCount) * D;
        const rh = y1 - y0;
        let xCursor = 0;

        row.forEach((cell) => {
          if (!cell) return;
          const cw = (cell.w || 0.5) * W;
          if (xCursor + cw > W + 0.001) return;
          const pts = zonePolygon(floor.z, xCursor + 0.03, y0 + 0.03, cw - 0.06, rh - 0.06);
          const zoneKey = cell.u ? 'tbd' : cell.t;
          const style = ZONES[zoneKey] || ZONES.tbd;

          const pg = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          pg.setAttribute('points', poly(pts));
          pg.setAttribute('fill', style.fill);
          pg.setAttribute('stroke', style.stroke);
          pg.setAttribute('stroke-width', '1.5');
          if (style.dash || floor.uncertain) pg.setAttribute('stroke-dasharray', style.dash || '5 3');
          g.appendChild(pg);

          addAlignedLabel(g, pts, zoneKey, cell.u || floor.uncertain);
          xCursor += cw;
        });
      });

      addFloorLabel(g, floor);
      floorGroups.appendChild(g);
    }

    floors.forEach(renderFloor);

    function fitViewBox() {
      const svg = document.getElementById('buildingSvg');
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      [floorGroups, dimLines].forEach((group) => {
        try {
          const b = group.getBBox();
          minX = Math.min(minX, b.x);
          minY = Math.min(minY, b.y);
          maxX = Math.max(maxX, b.x + b.width);
          maxY = Math.max(maxY, b.y + b.height);
        } catch (_) { /* empty group */ }
      });
      const pad = 90;
      const zoom = 1.32;
      minX -= pad; minY -= pad; maxX += pad; maxY += pad;
      const contentW = maxX - minX;
      const contentH = maxY - minY;
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const cw = svg.clientWidth || window.innerWidth;
      const ch = svg.clientHeight || window.innerHeight;
      const scale = Math.min(cw / contentW, ch / contentH);
      const vbW = cw / scale / zoom;
      const vbH = ch / scale / zoom;
      svg.setAttribute('viewBox', `${cx - vbW / 2} ${cy - vbH / 2} ${vbW} ${vbH}`);
    }

    function renderDims() {
      const xDim = ISO.ox + (W - D) * ISO.sx + 120;
      floors.forEach((f) => {
        if (!f.gapLabel) return;
        const lower = iso(W + 0.08, D * 0.5, f.z);
        const upper = iso(W + 0.08, D * 0.5, f.z + 1);

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', xDim);
        line.setAttribute('y1', lower.y);
        line.setAttribute('x2', xDim);
        line.setAttribute('y2', upper.y);
        line.setAttribute('stroke', '#64748b');
        line.setAttribute('stroke-width', '1.5');
        dimLines.appendChild(line);

        [lower.y, upper.y].forEach((y) => {
          const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          tick.setAttribute('x1', xDim - 10);
          tick.setAttribute('y1', y);
          tick.setAttribute('x2', xDim + 10);
          tick.setAttribute('y2', y);
          tick.setAttribute('stroke', '#64748b');
          dimLines.appendChild(tick);
        });

        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', xDim + 16);
        t.setAttribute('y', (lower.y + upper.y) / 2 + 5);
        t.textContent = f.gapLabel;
        dimLines.appendChild(t);
      });
    }
    renderDims();
    fitViewBox();
    window.addEventListener('resize', fitViewBox);

    function refreshFourLayerI18n() {
      applyDemoStaticI18n();
      floorGroups.innerHTML = '';
      dimLines.innerHTML = '';
      floors.forEach(renderFloor);
      renderDims();
      fitViewBox();
    }

  </script>

  <script src="js/aidc-locale-bridge.js?v=66"></script>
  <script src="js/i18n.js?v=66"></script>
  <script src="js/lang-switch.js?v=66"></script>
  <script src="js/i18n-bootstrap.js?v=66"></script>
  <script>
    AidcI18nBootstrap.bootstrap('ai-dc-four-layer', {
      onReady: function () { if (typeof refreshFourLayerI18n === 'function') refreshFourLayerI18n(); },
      onLocaleChange: function () { if (typeof refreshFourLayerI18n === 'function') refreshFourLayerI18n(); },
    });
    if (window.AidcLocaleBridge) {
      AidcLocaleBridge.initIframeListener(function (locale) {
        if (window.AidcI18n && AidcI18n.getLocale() !== locale) {
          AidcI18n.setLocale(locale, { page: 'ai-dc-four-layer', common: true, basePath: 'i18n/' });
        }
      }, { selfSource: 'ai-dc-four-layer' });
    }
  </script>

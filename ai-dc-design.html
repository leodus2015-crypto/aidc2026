<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI DC 布局：数据中心机柜与机房三维布局设计演示。" />
  <meta name="theme-color" content="#f8fafc" />
  <link rel="canonical" href="https://www.aidc2026.cn/ai-dc-design.html" />
  <title>AI DC布局 · AI Data Center</title>
  <script src="js/aidc-theme.js?v=84"></script>
  <script src="js/embed-mode.js?v=84"></script>
  <script src="js/theme-switch.js?v=84"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/theme.css?v=84" />
  <link rel="stylesheet" href="css/embed.css?v=84" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900" data-i18n-page="ai-dc-design">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav
      class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-3 px-4 py-3 sm:px-6 lg:px-8 xl:max-w-7xl"
      data-i18n-aria-label="nav.aria"
      aria-label="主导航"
    >
      <a href="ai-dc-design.html" class="flex min-w-0 shrink-0 items-center" data-i18n-aria-label="nav.homeAria" aria-label="AIDC 2026 · 首页">
        <img
          src="aidc2026-logo.svg"
          alt="AIDC 2026 · AI Data Center"
          width="593"
          height="118"
          class="h-8 w-auto max-h-10 object-contain object-left sm:h-9 md:h-10"
        />
      </a>

      <div class="ml-auto flex flex-wrap items-center gap-4">
        <ul class="flex flex-wrap items-center gap-6 text-sm font-semibold">
          <li>
            <a
              href="ai-dc-design.html"
              class="inline-block border-b-2 border-blue-600 pb-1 text-blue-700"
              aria-current="page"
              data-i18n="nav.aiDcLayout"
            >AI DC规划</a>
          </li>
          <li>
            <a
              href="index.html#inference"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.inference"
            >Agentic推理</a>
          </li>
          <li>
            <a
              href="post-training.html"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.postTraining"
            >后训练</a>
          </li>
          <li>
            <a
              href="white-paper.html"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.whitePaper"
            >白皮书</a>
          </li>
          <li>
            <a
              href="about-us.html"
              class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950"
              data-i18n="nav.aboutUs"
            >About US</a>
          </li>
        </ul>
        <div id="lang-switch-root" class="shrink-0"></div>
        <div id="theme-switch-root" class="shrink-0"></div>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8 xl:max-w-7xl 2xl:px-10">
    <section class="flex flex-col gap-6 lg:gap-8">
      <div class="hidden" hidden aria-hidden="true">
        <div
          class="inline-flex flex-wrap gap-1 rounded-2xl bg-slate-100 p-1 shadow-inner shadow-slate-200/60"
          role="tablist"
          data-i18n-aria-label="tabs.aria"
          aria-label="布局与规划"
        >
          <button
            type="button"
            id="tab-room-layout"
            role="tab"
            aria-selected="true"
            aria-controls="panel-room-layout"
            data-layout-tab="roomLayout"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-blue-700 shadow-sm transition bg-white"
            data-i18n="tabs.roomLayout"
          >机房布局</button>
          <button
            type="button"
            id="tab-tcp"
            role="tab"
            aria-selected="false"
            aria-controls="panel-tcp"
            data-layout-tab="tcp"
            tabindex="-1"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
            data-i18n="tabs.tcp"
          >Token->Card->Power</button>
          <button
            type="button"
            id="tab-compute-est"
            role="tab"
            aria-selected="false"
            aria-controls="panel-compute-est"
            data-layout-tab="computeEst"
            tabindex="-1"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
            data-i18n="tabs.computeEst"
          >算力估算</button>
          <button
            type="button"
            id="tab-plan"
            role="tab"
            aria-selected="false"
            aria-controls="panel-plan"
            data-layout-tab="plan"
            tabindex="-1"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
            data-i18n="tabs.plan"
          >机柜规划</button>
          <button
            type="button"
            id="tab-synergy"
            role="tab"
            aria-selected="false"
            aria-controls="panel-synergy"
            data-layout-tab="synergy"
            tabindex="-1"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
            data-i18n="tabs.synergy"
          >产品协同</button>
          <button
            type="button"
            id="tab-case-a"
            role="tab"
            aria-selected="false"
            aria-controls="panel-case-a"
            data-layout-tab="a"
            tabindex="-1"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
            data-i18n="tabs.caseA"
          >案例A（风冷）</button>
          <button
            type="button"
            id="tab-case-b"
            role="tab"
            aria-selected="false"
            aria-controls="panel-case-b"
            data-layout-tab="b"
            tabindex="-1"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
            data-i18n="tabs.caseB"
          >案例B（风冷）</button>
          <button
            type="button"
            id="tab-roi"
            role="tab"
            aria-selected="false"
            aria-controls="panel-roi"
            data-layout-tab="roi"
            tabindex="-1"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
            data-i18n="tabs.roi"
          >Investment ROI</button>
        </div>
      </div>

      <div id="panel-room-layout" role="tabpanel" aria-labelledby="tab-room-layout" class="min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="roomLayout"
            data-i18n-title="iframe.roomLayout"
            title="AI DC 布局 · 机房布局"
            class="block h-[min(92vh,75rem)] w-full min-h-[44rem] bg-slate-50"
            loading="eager"
          ></iframe>
        </div>
      </div>

      <div id="panel-tcp" role="tabpanel" aria-labelledby="tab-tcp" aria-hidden="true" class="hidden min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="tcp"
            data-i18n-title="iframe.tcp"
            title="AI DC 布局 · Token → Card → Power"
            class="block h-[min(92vh,75rem)] w-full min-h-[44rem] bg-slate-50"
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <div id="panel-compute-est" role="tabpanel" aria-labelledby="tab-compute-est" aria-hidden="true" class="hidden min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="computeEst"
            data-i18n-title="iframe.computeEst"
            title="AI DC 布局 · 算力估算"
            class="block h-[min(92vh,75rem)] w-full min-h-[44rem] bg-slate-50"
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <div id="panel-case-a" role="tabpanel" aria-labelledby="tab-case-a" aria-hidden="true" class="hidden min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="caseA"
            data-i18n-title="iframe.caseA"
            title="AI DC 布局 · 案例A（风冷）"
            class="block h-[min(85vh,60rem)] w-full min-h-[32rem] bg-[#f4f3ef]"
          ></iframe>
        </div>
      </div>

      <div id="panel-case-b" role="tabpanel" aria-labelledby="tab-case-b" aria-hidden="true" class="hidden min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="caseB"
            data-i18n-title="iframe.caseB"
            title="AI DC 布局 · 案例B（风冷）"
            class="block h-[min(85vh,60rem)] w-full min-h-[32rem] bg-[#f4f3ef]"
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <div id="panel-plan" role="tabpanel" aria-labelledby="tab-plan" aria-hidden="true" class="hidden min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="plan"
            data-i18n-title="iframe.plan"
            title="AI DC 布局 · 机柜规划"
            class="block h-[min(90vh,72rem)] w-full min-h-[40rem] bg-[#f2f6fc]"
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <div id="panel-synergy" role="tabpanel" aria-labelledby="tab-synergy" aria-hidden="true" class="hidden min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="synergy"
            data-i18n-title="iframe.synergy"
            title="AI DC 布局 · 产品协同"
            class="block h-[min(92vh,75rem)] w-full min-h-[44rem] bg-[#f0f5fc]"
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <div id="panel-roi" role="tabpanel" aria-labelledby="tab-roi" aria-hidden="true" class="hidden min-w-0 w-full">
        <div class="min-w-0 overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl shadow-slate-200/70">
          <iframe
            data-iframe-key="roi"
            data-i18n-title="iframe.roi"
            title="AI DC 布局 · Investment ROI"
            class="block h-[min(90vh,72rem)] w-full min-h-[40rem] bg-slate-50"
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-200 bg-white py-6">
    <p class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-center text-sm text-slate-500">
      <span><span data-i18n="footer.miit"></span>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="transition hover:text-slate-700">苏ICP备2026026790号-3</a>
      </span>
      <span class="hidden sm:inline" aria-hidden="true">|</span>
      <span><span data-i18n="footer.publicSecurity"></span>
        <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=32010602012455" target="_blank" rel="noopener noreferrer" class="transition hover:text-slate-700">苏公网安备32010602012455号</a>
      </span>
    </p>
  </footer>

<script src="js/aidc-locale-bridge.js?v=84"></script>
  <script src="js/i18n.js?v=84"></script>

<script src="js/aidc-mega-nav.js?v=84"></script>

  <script>
    AidcI18nBootstrap.bootstrap('ai-dc-design', {
      onReady: function () {
        AidcAiDcDesignPage.init();
      },
      onLocaleChange: function () {
        AidcAiDcDesignPage.syncIframes({ reload: true });
      },
    });
    if (window.AidcLocaleBridge) {
      AidcLocaleBridge.initIframeListener(function (locale) {
        if (window.AidcI18n && AidcI18n.getLocale() !== locale) {
          AidcI18n.setLocale(locale, { page: 'ai-dc-design', common: true, basePath: 'i18n/' });
        }
      }, { selfSource: 'ai-dc-design' });
    }
  </script>
</body>
</html>

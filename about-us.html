      </div>

      <div class="grid gap-6 lg:gap-8">
        <article id="mission" class="scroll-mt-28 rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-8">

          <h2 class="mt-2 text-xl font-bold text-slate-950 sm:text-2xl" data-i18n="mission.title"></h2>
          <div class="mt-4 space-y-3 text-base leading-7 text-slate-600">
            <p data-i18n="mission.p1"></p>
            <p data-i18n="mission.p2"></p>
          </div>
        </article>

        <article id="code-volume" class="scroll-mt-28 rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-8">
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-blue-600" data-i18n="codeVolume.tag"></p>
          <h2 class="mt-2 text-xl font-bold text-slate-950 sm:text-2xl" data-i18n="codeVolume.title"></h2>
          <div class="mt-4 space-y-3 text-base leading-7 text-slate-600">
            <p data-i18n-html="codeVolume.intro"></p>
          </div>
          <dl class="mt-6 grid gap-4 sm:grid-cols-3">
            <div class="aidc-inset-panel rounded-2xl px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="codeVolume.statLinesLabel"></dt>
              <dd class="mt-1 flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
                <span class="text-lg font-semibold text-slate-900" data-i18n="codeVolume.statLinesValue"></span>
                <span class="text-sm font-medium text-slate-400" aria-hidden="true">≈</span>
                <span class="text-lg font-semibold text-blue-700" data-i18n="codeVolume.statTokensValue"></span>
              </dd>
              <p class="mt-2 text-xs leading-5 text-slate-500" data-i18n="codeVolume.statLinesNote"></p>
            </div>
            <div class="aidc-inset-panel rounded-2xl px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="codeVolume.statFilesLabel"></dt>
              <dd class="mt-1 text-lg font-semibold text-slate-900" data-i18n="codeVolume.statFilesValue"></dd>
            </div>
            <div class="aidc-inset-panel rounded-2xl px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="codeVolume.statLangLabel"></dt>
              <dd class="mt-1 text-sm font-medium text-slate-800" data-i18n="codeVolume.statLangValue"></dd>
            </div>
          </dl>
          <div class="mt-8">
            <h3 class="text-sm font-semibold text-slate-900" data-i18n="codeVolume.langChartTitle"></h3>
            <ul class="mt-4 space-y-4" role="list">
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">HTML</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langHtmlShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-blue-600" style="width: 77.8%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langHtmlNote"></p>
              </li>
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">JavaScript</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langJsShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-amber-500" style="width: 19.9%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langJsNote"></p>
              </li>
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">SVG</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langSvgShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-violet-500" style="width: 0.5%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langSvgNote"></p>
              </li>
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">Shell</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langShellShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-emerald-500" style="width: 1.8%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langShellNote"></p>
              </li>
            </ul>
          </div>

              <span id="usageSource">Cursor Dashboard · Included Usage</span>

          </div>
          <dl class="mt-6 grid gap-4 sm:grid-cols-2">
            <div class="aidc-inset-panel rounded-2xl px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="usage.totalLabel"></dt>
              <dd id="usageTotalTokens" class="mt-1 text-lg font-semibold text-slate-900">—</dd>
            </div>
            <div class="aidc-inset-panel rounded-2xl px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="usage.updatedLabel"></dt>
              <dd id="usageUpdatedAt" class="mt-1 text-sm font-medium text-slate-800">—</dd>

              <div class="min-w-0">

            <li class="flex gap-4 aidc-inset-panel rounded-2xl p-4">

              <div class="min-w-0">

            <li class="flex gap-4 aidc-inset-panel rounded-2xl p-4">

              <div class="min-w-0">

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="About US · AIDC 2026 站点使命、AI 使用与开发团队介绍。" />
  <meta name="theme-color" content="#f8fafc" />
  <title>About US · AI Data Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900" data-i18n-page="about-us">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav
      class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-3 px-4 py-3 sm:px-6 lg:px-8 xl:max-w-7xl"
      data-i18n-aria-label="nav.aria"
      aria-label="主导航"
    >
      <a href="index.html" class="flex min-w-0 shrink-0 items-center" data-i18n-aria-label="nav.homeAria" aria-label="AIDC 2026 · 首页">
        <img src="aidc2026-logo.svg" alt="AIDC 2026 · AI Data Center" width="593" height="118" class="h-8 w-auto max-h-10 object-contain object-left sm:h-9 md:h-10" />
      </a>

      <div class="ml-auto flex flex-wrap items-center gap-4">
        <ul class="flex flex-wrap items-center gap-6 text-sm font-semibold">
          <li><a href="ai-dc-design.html" class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950" data-i18n="nav.aiDcLayout">AI DC规划</a></li>
          <li><a href="index.html#inference" class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950" data-i18n="nav.inference">Agentic推理</a></li>
          <li><a href="post-training.html" class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950" data-i18n="nav.postTraining">后训练</a></li>
          <li><a href="white-paper.html" class="inline-block border-b-2 border-transparent pb-1 text-slate-600 transition hover:border-slate-300 hover:text-slate-950" data-i18n="nav.whitePaper">白皮书</a></li>
          <li><a href="about-us.html" class="inline-block border-b-2 border-blue-600 pb-1 text-blue-700" aria-current="page" data-i18n="nav.aboutUs">About US</a></li>
        </ul>
        <div id="lang-switch-root" class="shrink-0"></div>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8 xl:max-w-7xl 2xl:px-10">
    <section class="flex flex-col gap-8 lg:gap-10">
      <div class="w-full max-w-3xl xl:max-w-4xl">
        <h1 class="text-3xl font-bold tracking-tight text-slate-950 sm:text-5xl" data-i18n="page.h1"></h1>
      </div>

      <div class="grid gap-6 lg:gap-8">
        <article id="mission" class="scroll-mt-28 rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-8">
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-blue-600" data-i18n="mission.tag"></p>
          <h2 class="mt-2 text-xl font-bold text-slate-950 sm:text-2xl" data-i18n="mission.title"></h2>
          <div class="mt-4 space-y-3 text-base leading-7 text-slate-600">
            <p data-i18n="mission.p1"></p>
            <p data-i18n="mission.p2"></p>
          </div>
        </article>

        <article id="code-volume" class="scroll-mt-28 rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-8">
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-blue-600" data-i18n="codeVolume.tag"></p>
          <h2 class="mt-2 text-xl font-bold text-slate-950 sm:text-2xl" data-i18n="codeVolume.title"></h2>
          <div class="mt-4 space-y-3 text-base leading-7 text-slate-600">
            <p data-i18n-html="codeVolume.intro"></p>
          </div>
          <dl class="mt-6 grid gap-4 sm:grid-cols-3">
            <div class="rounded-2xl border border-slate-100 bg-slate-50 px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="codeVolume.statLinesLabel"></dt>
              <dd class="mt-1 flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
                <span class="text-lg font-semibold text-slate-900" data-i18n="codeVolume.statLinesValue"></span>
                <span class="text-sm font-medium text-slate-400" aria-hidden="true">≈</span>
                <span class="text-lg font-semibold text-blue-700" data-i18n="codeVolume.statTokensValue"></span>
              </dd>
              <p class="mt-2 text-xs leading-5 text-slate-500" data-i18n="codeVolume.statLinesNote"></p>
            </div>
            <div class="rounded-2xl border border-slate-100 bg-slate-50 px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="codeVolume.statFilesLabel"></dt>
              <dd class="mt-1 text-lg font-semibold text-slate-900" data-i18n="codeVolume.statFilesValue"></dd>
            </div>
            <div class="rounded-2xl border border-slate-100 bg-slate-50 px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="codeVolume.statLangLabel"></dt>
              <dd class="mt-1 text-sm font-medium text-slate-800" data-i18n="codeVolume.statLangValue"></dd>
            </div>
          </dl>
          <div class="mt-8">
            <h3 class="text-sm font-semibold text-slate-900" data-i18n="codeVolume.langChartTitle"></h3>
            <ul class="mt-4 space-y-4" role="list">
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">HTML</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langHtmlShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-blue-600" style="width: 80.7%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langHtmlNote"></p>
              </li>
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">JavaScript</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langJsShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-amber-500" style="width: 16.9%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langJsNote"></p>
              </li>
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">SVG</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langSvgShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-violet-500" style="width: 0.5%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langSvgNote"></p>
              </li>
              <li>
                <div class="flex items-center justify-between gap-4 text-sm">
                  <span class="font-medium text-slate-800">Shell</span>
                  <span class="shrink-0 tabular-nums text-slate-600" data-i18n="codeVolume.langShellShare"></span>
                </div>
                <div class="mt-2 h-2 overflow-hidden rounded-full bg-slate-100" aria-hidden="true"><div class="h-full rounded-full bg-emerald-500" style="width: 1.8%"></div></div>
                <p class="mt-1.5 text-xs text-slate-500" data-i18n="codeVolume.langShellNote"></p>
              </li>
            </ul>
          </div>
        </article>

        <article id="usage" class="scroll-mt-28 rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-8">
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-blue-600" data-i18n="usage.tag"></p>
          <h2 class="mt-2 text-xl font-bold text-slate-950 sm:text-2xl" data-i18n="usage.title"></h2>
          <div class="mt-4 space-y-3 text-base leading-7 text-slate-600">
            <p data-i18n-html="usage.intro"></p>
            <p class="text-sm text-slate-500">
              <span data-i18n="usage.dataSourceLabel"></span>
              <span id="usageSource">Cursor Dashboard · Included Usage</span>
            </p>
          </div>
          <dl class="mt-6 grid gap-4 sm:grid-cols-2">
            <div class="rounded-2xl border border-slate-100 bg-slate-50 px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="usage.totalLabel"></dt>
              <dd id="usageTotalTokens" class="mt-1 text-lg font-semibold text-slate-900">—</dd>
            </div>
            <div class="rounded-2xl border border-slate-100 bg-slate-50 px-4 py-3">
              <dt class="text-xs font-medium text-slate-500" data-i18n="usage.updatedLabel"></dt>
              <dd id="usageUpdatedAt" class="mt-1 text-sm font-medium text-slate-800">—</dd>
            </div>
          </dl>
          <div class="mt-8">
            <h3 class="text-sm font-semibold text-slate-900" data-i18n="usage.periodsTitle"></h3>
            <ul id="usagePeriodList" class="mt-3 space-y-2 text-sm text-slate-700" role="list"></ul>
          </div>
          <div class="mt-8">
            <h3 id="usageBreakdownTitle" class="text-sm font-semibold text-slate-900"></h3>
            <ul id="usageBreakdown" class="mt-4 space-y-5" role="list"></ul>
          </div>
          <p id="usageNote" class="mt-6 text-xs leading-5 text-slate-500" data-i18n="usage.note"></p>
        </article>

        <article id="team" class="scroll-mt-28 rounded-3xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-200/70 sm:p-8">
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-blue-600" data-i18n="team.tag"></p>
          <h2 class="mt-2 text-xl font-bold text-slate-950 sm:text-2xl" data-i18n="team.title"></h2>
          <div class="mt-4 space-y-3 text-base leading-7 text-slate-600">
            <p data-i18n="team.motto"></p>
          </div>
          <ul class="mt-6 space-y-4">
            <li class="flex gap-4 rounded-2xl border border-slate-100 bg-slate-50 p-4">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full bg-white ring-1 ring-slate-200">
                <img src="assets/avatar_tech_cto_head_only.png" data-i18n-alt="team.m1Alt" alt="来自大城市的人" width="48" height="48" class="h-full w-full object-cover" />
              </div>
              <div class="min-w-0">
                <p class="font-semibold text-slate-900" data-i18n="team.m1Name"></p>
                <p class="mt-1 text-sm leading-6 text-slate-600" data-i18n="team.m1Role"></p>
              </div>
            </li>
            <li class="flex gap-4 rounded-2xl border border-slate-100 bg-slate-50 p-4">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full bg-white ring-1 ring-slate-200">
                <img src="assets/cursor-logo.png" data-i18n-alt="team.m2Alt" alt="Cursor" width="48" height="48" class="h-full w-full object-cover" />
              </div>
              <div class="min-w-0">
                <p class="font-semibold text-slate-900" data-i18n="team.m2Name"></p>
                <p class="mt-1 text-sm leading-6 text-slate-600" data-i18n="team.m2Role"></p>
              </div>
            </li>
            <li class="flex gap-4 rounded-2xl border border-slate-100 bg-slate-50 p-4">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full bg-white ring-1 ring-slate-200">
                <img src="assets/tiger.png" data-i18n-alt="team.m3Alt" alt="虎哥" width="48" height="48" class="h-full w-full object-cover" />
              </div>
              <div class="min-w-0">
                <p class="font-semibold text-slate-900" data-i18n="team.m3Name"></p>
                <p class="mt-1 text-sm leading-6 text-slate-600" data-i18n="team.m3Role"></p>
              </div>
            </li>
            <li class="flex gap-4 rounded-2xl border border-slate-100 bg-slate-50 p-4">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full bg-white ring-1 ring-slate-200">
                <img src="assets/Johnson.jpg" data-i18n-alt="team.m4Alt" alt="Johnson" width="48" height="48" class="h-full w-full object-cover" />
              </div>
              <div class="min-w-0">
                <p class="font-semibold text-slate-900" data-i18n="team.m4Name"></p>
                <p class="mt-1 text-sm leading-6 text-slate-600" data-i18n="team.m4Role"></p>
              </div>
            </li>
            <li class="flex gap-4 rounded-2xl border border-slate-100 bg-slate-50 p-4">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full bg-white ring-1 ring-slate-200">
                <img src="assets/feifei.jpg" data-i18n-alt="team.m5Alt" alt="飞飞" width="48" height="48" class="h-full w-full object-cover" />
              </div>
              <div class="min-w-0">
                <p class="font-semibold text-slate-900" data-i18n="team.m5Name"></p>
                <p class="mt-1 text-sm leading-6 text-slate-600" data-i18n="team.m5Role"></p>
              </div>
            </li>
            <li class="flex gap-4 rounded-2xl border border-slate-100 bg-slate-50 p-4">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-full bg-white ring-1 ring-slate-200">
                <img src="assets/Andy.png" data-i18n-alt="team.m6Alt" alt="Andy" width="48" height="48" class="h-full w-full object-cover" />
              </div>
              <div class="min-w-0">
                <p class="font-semibold text-slate-900" data-i18n="team.m6Name"></p>
                <p class="mt-1 text-sm leading-6 text-slate-600" data-i18n="team.m6Role"></p>
              </div>
            </li>
          </ul>
        </article>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-200 bg-white py-6">
    <p class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 text-center text-sm text-slate-500">
      <span><span data-i18n="footer.miit"></span>
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="transition hover:text-slate-700">苏ICP备2026026790号-3</a>
      </span>
      <span class="hidden sm:inline" aria-hidden="true">|</span>
      <span><span data-i18n="footer.publicSecurity"></span>
        <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=32010602012455" target="_blank" rel="noopener noreferrer" class="transition hover:text-slate-700">苏公网安备32010602012455号</a>
      </span>
    </p>
  </footer>

<script src="js/i18n.js?v=10"></script>

</body>

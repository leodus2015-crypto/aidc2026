<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="480" viewBox="0 0 1056 480" role="img" aria-labelledby="t3 d3">
  <title id="t3">Schematic: 11 July peak of lateral movement</title>
  <desc id="d3">Horizontal bars: rest of reconstructed window about 9,923 actions; 11 July about 7,677 actions.</desc>
  <rect width="1056" height="480" fill="#ffffff"/>
  <text x="528" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1c1917">Schematic: 11 July peak of lateral movement</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#57534e">
    <text x="248" y="168" text-anchor="end">Rest of reconstructed window</text>
    <text x="248" y="186" text-anchor="end">(approx. 9,923)</text>
    <text x="248" y="286" text-anchor="end">11 July</text>
    <text x="248" y="304" text-anchor="end">(approx. 7,677)</text>
  </g>
  <!-- max 12000 -> width 720 -->
  <rect x="268" y="148" width="595" height="52" fill="#1f3a5f"/>
  <rect x="268" y="266" width="461" height="52" fill="#c45c11"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#57534e" text-anchor="middle">
    <text x="268" y="368">0</text>
    <text x="388" y="368">2,000</text>
    <text x="508" y="368">4,000</text>
    <text x="628" y="368">6,000</text>
    <text x="748" y="368">8,000</text>
    <text x="868" y="368">10,000</text>
    <text x="988" y="368">12,000</text>
    <text x="628" y="400">Hugging Face reconstructed actions (approx.)</text>
  </g>
  <line x1="268" y1="148" x2="268" y2="348" stroke="#1c1917"/>
  <line x1="268" y1="348" x2="1000" y2="348" stroke="#1c1917"/>
</svg>

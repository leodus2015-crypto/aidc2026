<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI DC 白皮书 2.0 讨论稿：章节规划对齐工作台。" />
  <meta name="theme-color" content="#f8fafc" />
  <title>白皮书 2.0讨论稿 · AI Data Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
    html.embed-mode #siteHeader,
    html.embed-mode #siteFooter {
      display: none !important;
    }
    html.embed-mode main {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    body.preview-mode .edit-control {
      display: none !important;
    }
    body.preview-mode .field-input {
      pointer-events: none;
      border-color: transparent !important;
      background: transparent !important;
      box-shadow: none !important;
      resize: none;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    body.preview-mode .field-input:focus {
      outline: none;
      ring: none;
    }
  </style>
  <script>
    (function () {
      if (new URLSearchParams(location.search).get('embed') === '1' || window.self !== window.top) {
        document.documentElement.classList.add('embed-mode');
      }
    })();
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 edit-mode">
  <header id="siteHeader" class="sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav
      class="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-x-6 gap-y-3 px-4 py-3 sm:px-6"
      aria-label="主导航"
    >
      <a href="index.html" class="flex min-w-0 shrink-0 items-center gap-3" aria-label="AIDC 2026 · 首页">
        <img
          src="aidc2026-logo.svg"
          alt="AIDC 2026 · AI Data Center"
          width="593"
          height="118"
          class="h-8 w-auto max-h-10 object-contain object-left sm:h-9"
        />
        <span class="hidden rounded-full bg-amber-100 px-2.5 py-1 text-xs font-semibold text-amber-900 sm:inline">内部 · 章节对齐</span>
      </a>
      <ul class="flex flex-wrap items-center gap-5 text-sm font-semibold">
        <li><a href="white-paper.html" class="text-blue-700">白皮书</a></li>
      </ul>
    </nav>
  </header>

  <main class="mx-auto max-w-4xl px-4 py-6 sm:px-6 sm:py-8">
    <section id="pageHero" class="sticky top-0 z-10 -mx-4 mb-6 border-b border-slate-200 bg-slate-50/95 px-4 py-4 backdrop-blur sm:static sm:mx-0 sm:rounded-2xl sm:border sm:border-slate-200 sm:bg-white sm:px-5 sm:shadow-sm">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-blue-600">Whitepaper 2.0 · Draft</p>
          <h1 class="mt-1 text-xl font-bold tracking-tight text-slate-950 sm:text-2xl">2.0讨论稿</h1>
        </div>
        <div
          class="inline-flex shrink-0 gap-1 rounded-2xl bg-slate-100 p-1 shadow-inner shadow-slate-200/60"
          role="tablist"
          aria-label="视图模式"
        >
          <button
            type="button"
            id="tabPreview"
            role="tab"
            aria-selected="false"
            aria-controls="outlineWaterfall"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-white/80 hover:text-slate-950"
          >
            预览
          </button>
          <button
            type="button"
            id="tabEdit"
            role="tab"
            aria-selected="true"
            aria-controls="outlineWaterfall"
            class="rounded-xl px-4 py-2 text-sm font-semibold text-blue-700 shadow-sm transition bg-white"
          >
            编辑
          </button>
        </div>
      </div>

      <div id="editToolbar" class="edit-control mt-4 flex flex-wrap items-center gap-2 border-t border-slate-100 pt-4">
        <button type="button" id="btnExportMd" class="rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 sm:text-sm">导出 Markdown</button>
        <button type="button" id="btnExportJson" class="rounded-xl border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 sm:text-sm">导出 JSON</button>
        <button type="button" id="btnImport" class="rounded-xl bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 sm:text-sm">导入 Markdown</button>
        <button type="button" id="btnSaveNow" class="rounded-xl border border-emerald-300 bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-800 hover:bg-emerald-100 sm:text-sm">立即保存</button>
        <span id="saveStatus" class="ml-auto text-xs text-slate-500" aria-live="polite"></span>
      </div>
      <p class="edit-control mt-2 text-xs leading-5 text-slate-500">编辑内容会自动保存到浏览器本地（刷新后仍可恢复）；也可随时点击「立即保存」或导出 JSON 备份。</p>
    </section>

    <div id="summaryBar" class="mb-6 flex flex-wrap gap-2 text-xs font-medium text-slate-600" aria-live="polite"></div>

    <div id="outlineWaterfall" class="space-y-10 pb-12">
      <p class="text-slate-500">加载中…</p>
    </div>
  </main>

  <div
    id="importPanel"
    class="edit-control fixed inset-0 z-30 hidden flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm"
    role="dialog"
    aria-modal="true"
    aria-labelledby="importTitle"
  >
    <div class="max-h-[90vh] w-full max-w-3xl overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4 sm:px-6">
        <h2 id="importTitle" class="text-lg font-semibold text-slate-900">导入 Markdown</h2>
        <button type="button" id="btnImportClose" class="rounded-lg px-3 py-1.5 text-sm text-slate-500 hover:bg-slate-100">关闭</button>
      </div>
      <div class="space-y-4 overflow-y-auto p-5 sm:p-6" style="max-height: calc(90vh - 8rem)">
        <p class="text-sm text-slate-600">粘贴 Markdown 文本，或选择 .md 文件。导入前可先预览解析结果。</p>
        <label class="block">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-400">选择文件</span>
          <input id="importFile" type="file" accept=".md,text/markdown,text/plain" class="mt-2 block w-full text-sm text-slate-600 file:mr-3 file:rounded-lg file:border-0 file:bg-blue-50 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-blue-700" />
        </label>
        <label class="block">
          <span class="text-xs font-semibold uppercase tracking-wide text-slate-400">Markdown 内容</span>
          <textarea
            id="importText"
            rows="14"
            class="mt-2 w-full rounded-2xl border border-slate-300 px-4 py-3 font-mono text-xs leading-5 text-slate-800 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
            placeholder="# 第1章 …"
          ></textarea>
        </label>
        <p id="importPreview" class="text-sm"></p>
      </div>
      <div class="flex flex-wrap justify-end gap-2 border-t border-slate-100 px-5 py-4 sm:px-6">
        <button type="button" id="btnImportPreview" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">预览解析</button>
        <button type="button" id="btnImportApply" class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">确认导入</button>
      </div>
    </div>
  </div>

  <footer id="siteFooter" class="border-t border-slate-200 bg-white py-6">
    <p class="text-center text-sm text-slate-500">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer" class="hover:text-slate-700">苏ICP备2026026790号-3</a>
    </p>
  </footer>

  <script src="js/outline-workbench.js?v=20260527-import-fix"></script>
</body>
</html>
